name: WEB-0.8.1 Source Mode Remediation

on:
  push:
    branches:
      - web-0.8.1-live-deployment-audit
    paths:
      - '.github/workflows/web-0.8.1-source-mode-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web-0.8.1-live-deployment-audit

      - name: Replace eager source tabs with conditional rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/climate_analyzer/app.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '    st.divider()\n    local_tab, map_tab = st.tabs(["Upload EPW", "Find climate"])\n\n'
          map_marker = '    with map_tab:\n'
          end_marker = '\ndef render_interpretation(text: str) -> None:\n'

          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected exactly one source-tab start marker, found {text.count(start_marker)}')
          start = text.index(start_marker)
          map_start = text.index(map_marker, start)
          end = text.index(end_marker, map_start)

          map_body = text[map_start + len(map_marker):end]
          unindented = []
          for line in map_body.splitlines(keepends=True):
              if line.strip() and not line.startswith('    '):
                  raise SystemExit(f'Unexpected indentation in map body: {line!r}')
              unindented.append(line[4:] if line.startswith('    ') else line)
          map_body = ''.join(unindented)

          replacement = '''    st.divider()\n    source_mode = st.radio(\n        "Climate source",\n        ["Upload EPW", "Find climate"],\n        horizontal=True,\n        label_visibility="collapsed",\n        key="climate_source_mode",\n    )\n\n    if source_mode == "Upload EPW":\n        st.subheader("Upload an EPW weather file")\n        st.write("Use an EnergyPlus Weather (EPW) file that you already have. The file is processed for the current session.")\n        local_file = st.file_uploader("Choose EPW file", type=["epw"], key="local_epw_upload")\n        if local_file is not None:\n            st.write(f"Selected file: `{local_file.name}`")\n            if st.button("Analyze this EPW", type="primary"):\n                set_active_climate_file(local_file.name, local_file.getvalue(), "Local upload | user-provided EPW | transient session")\n                st.rerun()\n        return\n\n'''

          new_text = text[:start] + replacement + map_body + text[end:]
          if 'st.tabs(["Upload EPW", "Find climate"])' in new_text:
              raise SystemExit('Eager source tabs remain after transform')
          if 'source_mode = st.radio(' not in new_text:
              raise SystemExit('Conditional source control was not inserted')
          path.write_text(new_text, encoding='utf-8')
          PY

          python -m compileall -q tools/climate_analyzer/app.py

      - name: Remove one-time workflow
        run: git rm .github/workflows/web-0.8.1-source-mode-remediation.yml

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/app.py
          git diff --cached --check
          git commit -m 'WEB-0.8.1: lazy-render climate source modes'
          git push origin HEAD:web-0.8.1-live-deployment-audit
