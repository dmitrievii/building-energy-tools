name: CLIMATE-0.10.12 Community Cloud memory hotfix

on:
  push:
    branches:
      - climate-0.10.12-community-cloud-memory-hotfix
    paths:
      - '.github/workflows/climate-0.10.12-memory-hotfix.yml'
      - 'tools/climate_analyzer/remediation/climate_0_10_12_memory_hotfix.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: climate-0.10.12-community-cloud-memory-hotfix
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Apply bounded-memory patches
        run: python tools/climate_analyzer/remediation/climate_0_10_12_memory_hotfix.py

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Compile modified sources
        run: |
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer tools/climate_analyzer/tests
          node --check deployment/live_browser_audit.mjs

      - name: Run focused memory hotfix tests
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_climate_0_10_12_memory_hotfix -v

      - name: Run complete Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Runtime catalog memory probe
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          from epw_climate_analyzer.catalog_runtime import load_production_station_catalog
          catalog = load_production_station_catalog()
          deep = int(catalog.memory_usage(index=True, deep=True).sum())
          print(f'rows={len(catalog):,}')
          print(f'columns={len(catalog.columns)}')
          print(f'deep_memory_mib={deep / 1024 / 1024:.2f}')
          assert len(catalog) == 98047
          assert deep < 128 * 1024 * 1024
          PY

      - name: Remove one-shot remediation files
        run: |
          rm -f tools/climate_analyzer/remediation/climate_0_10_12_memory_hotfix.py
          rm -f .github/workflows/climate-0.10.12-memory-hotfix.yml

      - name: Commit qualified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "fix: bound station catalog memory on Community Cloud"
          git push origin HEAD:climate-0.10.12-community-cloud-memory-hotfix
