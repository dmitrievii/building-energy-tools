name: CLIMATE-GEOSPHERE-0.1 branch remediation

on:
  push:
    branches:
      - climate-geosphere-0.1-historical-station-adapter

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.1-historical-station-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply GeoSphere semantic cleanup
        run: python tools/climate_analyzer/_geosphere_patch.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: Focused GeoSphere and canonical regression
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_geosphere_adapter tests.test_canonical_climate_model tests.test_time_series_overlay
      - name: Full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove temporary remediation files
        run: |
          rm tools/climate_analyzer/_geosphere_patch.py
          rm .github/workflows/climate-geosphere-0.1-remediation.yml
      - name: Commit validated GeoSphere adapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "CLIMATE-GEOSPHERE-0.1: qualify historical station adapter"
            git push origin HEAD:climate-geosphere-0.1-historical-station-adapter
          fi
