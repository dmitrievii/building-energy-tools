name: IGE P8.2B MeteoSwiss measured humidity source probe
on:
  push:
    branches: ['research/ige-p8-meteonorm8-batch-automation-20261012']
    paths: ['.github/workflows/ige-p8-2b-swiss-humidity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-contract-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch MeteoSwiss published monthly and hourly station CSV headers and hourly sampling
        run: |
          python - <<'PY'
          import urllib.request,csv,io,json,collections
          root="https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn"
          paths=["ogd-smn_meta_parameters.csv","abo/ogd-smn_abo_m.csv","pay/ogd-smn_pay_m.csv","ber/ogd-smn_ber_m.csv","abo/ogd-smn_abo_h_historical_2010-2019.csv","abo/ogd-smn_abo_h_historical_2020-2029.csv"]
          for path in paths:
            try:
              url=root+'/'+path
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'IGE-academic-P8.2B'}),timeout=50) as r:
                size=r.headers.get('content-length')
                head=r.read(6000).decode('utf-8-sig',errors='replace').splitlines()
              print("P8_2B_PROBE",json.dumps({"path":path,"bytes_reported":size,"header":head[0][:1400] if head else '',"first_row":head[1][:800] if len(head)>1 else '','lines_sampled':len(head)}),flush=True)
            except Exception as ex:print("P8_2B_PROBE_FAILURE",path,repr(ex),flush=True)
          PY
