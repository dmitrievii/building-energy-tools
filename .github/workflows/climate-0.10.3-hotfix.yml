name: CLIMATE-0.10.3 Catalog + Psychrometric Hotfix

on:
  push:
    branches:
      - climate-0.10.3-catalog-import-psychrometric-layout

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.10.3-catalog-import-psychrometric-layout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply remediation
        run: python .github/remediation/climate_0_10_3_hotfix.py

      - name: Compile Python sources
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts

      - name: Focused CLIMATE-0.10.3 regression
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_climate_0_10_3_regressions -v

      - name: Full regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated hotfix
        run: |
          git rm .github/workflows/climate-0.10.3-hotfix.yml
          git rm .github/remediation/climate_0_10_3_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git add tools/climate_analyzer/epw_climate_analyzer/charts.py
          git add tools/climate_analyzer/tests/test_climate_0_10_3_regressions.py
          git commit -m "CLIMATE-0.10.3: fix compare catalog loader and psychrometric layout"
          git push origin HEAD:climate-0.10.3-catalog-import-psychrometric-layout
