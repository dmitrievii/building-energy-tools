name: Temporary psychrometric comparison 0.7.4.5 patch

on:
  push:
    branches:
      - hotfix/v0.7.4.5-psychrometric-comparison-overlays-colors

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source changes
        run: python .github/scripts/apply_psychrometric_compare_0745.py
      - name: Validate patch
        run: |
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer tools/climate_analyzer/tests/test_psychrometric_runtime_guard_0_7_4_2.py
          git diff --check
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/comparison.py \
                  tools/climate_analyzer/epw_climate_analyzer/runtime_module_guard.py \
                  tools/climate_analyzer/tests/test_psychrometric_runtime_guard_0_7_4_2.py
          git commit -m "fix(climate): restore comparison psychrometric overlays"
          git push origin HEAD:hotfix/v0.7.4.5-psychrometric-comparison-overlays-colors
