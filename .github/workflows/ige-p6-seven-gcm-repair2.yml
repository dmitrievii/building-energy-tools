name: IGE P6.1 seven GCM repair2 targeted 7 windows
on:
  push:
    branches:
      - research/ige-p6-seven-gcm-repair2-20261010
    paths:
      - .github/workflows/ige-p6-seven-gcm-repair2.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  targeted-repair:
    name: repair ${{ matrix.model }} ${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {model: EC-Earth3, window: historical-1995-2014}
          - {model: EC-Earth3, window: ssp245-2040-2059}
          - {model: IPSL-CM6A-LR, window: historical-1995-2014}
          - {model: IPSL-CM6A-LR, window: ssp245-2080-2099}
          - {model: MPI-ESM1-2-HR, window: historical-1995-2014}
          - {model: MPI-ESM1-2-HR, window: ssp245-2040-2059}
          - {model: MPI-ESM1-2-HR, window: ssp585-2040-2059}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NetCDF scientific packages
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'netCDF4>=1.6,<2'
      - name: Run full offline science regression suite
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p6_*.py' -v
      - name: Fetch ONLY affected 20-year GCM window, preserve raw RH excursions
        run: python research/ige_cmip6/p6_seven_daily.py --model "${{ matrix.model }}" --window "${{ matrix.window }}" --workers 2
      - name: Store targeted repaired scientific artifact even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-${{ matrix.model }}-${{ matrix.window }}
          path: outputs/p6_seven_daily/${{ matrix.model }}/${{ matrix.window }}/
          if-no-files-found: warn
          retention-days: 14

  combined-audit:
    name: Audit 28 original + 7 repaired, 6200 NetCDF
    runs-on: ubuntu-latest
    needs: targeted-repair
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download 28 successful prior jobs and failed placeholders, WITHOUT mixing sources
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ige-p6-*-20*
          path: p6_prior
          merge-multiple: false
      - name: Download 7 independently rerun repaired jobs from current workflow
        uses: actions/download-artifact@v4
        with:
          pattern: ige-p6-*-20*
          path: p6_repaired
          merge-multiple: false
      - name: Assemble only 28 passing prior and 7 passing repaired inputs
        run: python research/ige_cmip6/p6_seven_repair_stage.py --prior p6_prior --repaired p6_repaired --destination p6_downloaded --report outputs/p6_seven_repair_stage.json
      - name: Independently validate 35 filesets and all 6200 model variable-year sources
        run: python research/ige_cmip6/p6_seven_daily_audit.py --root p6_downloaded --output outputs/p6_seven_closeout.json
      - name: Preserve comprehensive audit and exact source selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-seven-gcm-repair2-audit
          path: |
            outputs/p6_seven_closeout.json
            outputs/p6_seven_repair_stage.json
          retention-days: 30
          if-no-files-found: warn
