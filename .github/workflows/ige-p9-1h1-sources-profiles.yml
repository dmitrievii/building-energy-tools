name: IGE P9.1H1 minimal manually triggered source contracts

# Prospective scope amendment 2026-10-17: no repeated external network reads
# on push. Existing earlier workflow runs remain unmodified historical evidence.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'contracts = offline only; source_readback = one deliberate 2018 Hyytiälä real-source replay'
        required: true
        type: choice
        default: contracts
        options:
          - contracts
          - source_readback

permissions:
  contents: read

jobs:
  local_source_registry_and_synthetic_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen provenance registry and nonproduction scientific guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/ige_cmip6/p9_1h_observation_source_registry.json').read_text())
          assert x['phase']=='P9.1H1'
          assert x['no_model_skill_claim'] is True
          assert x['production_epw_ready'] is False
          assert len(x['sources'])==4  # Original frozen source inventory is immutable.
          assert all(s['source_original_bytes_verified'] is False for s in x['sources'])
          assert x['policy']['no_gapfilled_or_ERA5_assimilated_as_observation'] is True
          assert x['policy']['holdout_blind_until_model_and_thresholds_frozen'] is True
          print('P9H1 ORIGINAL REGISTRY UNALTERED: RESEARCH ONLY')
          PY
      - name: Test only critical timestamp, source-QC, synchronized-height, inversion and hourly completeness contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h1_canonical_tower_profiles.py' -v

  manual_original_HYY_2018_source_only:
    if: ${{ inputs.mode == 'source_readback' }}
    needs: local_source_registry_and_synthetic_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only frozen 2018 Hyytiälä Jan/Jul paired 4.2/67.2m readings, no 2021, no ERA5 fit, QC unqualified
        run: python -u research/ige_cmip6/p9_1h1_original_2018_SMARTSMEAR_profile_exploratory.py
      - name: Upload aggregates and original source hashes only, never sensor rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p9h1-manual-2018-only-source-readback-QC-unqualified
          path: outputs/p9h1/smartsmear_2018_real_measured_temp_profile_EXPLORATORY_QC_UNQUALIFIED.json
          if-no-files-found: warn
          retention-days: 30
