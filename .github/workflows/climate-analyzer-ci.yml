name: Climate Analyzer CI

on:
  pull_request:
    paths:
      - 'tools/climate_analyzer/**'
      - '.streamlit/**'
      - 'deployment/**'
      - 'website/PUBLICATION_CHECKLIST.md'
      - 'website/content/**'
      - 'docs/PUBLICATION_POLICY.md'
      - '.github/workflows/climate-analyzer-ci.yml'
  push:
    branches:
      - main
      - 'web-*'
    paths:
      - 'tools/climate_analyzer/**'
      - '.streamlit/**'
      - 'deployment/**'
      - 'website/PUBLICATION_CHECKLIST.md'
      - 'website/content/**'
      - 'docs/PUBLICATION_POLICY.md'
      - '.github/workflows/climate-analyzer-ci.yml'

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/climate_analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts

      - name: Validate scientific reference register
        run: python -m json.tool validation/scientific_reference_register.json >/dev/null

      - name: Validate station catalog provenance
        run: |
          python -m json.tool epw_climate_analyzer/data/station_catalog.meta.json >/dev/null
          python - <<'PY'
          from epw_climate_analyzer.catalog_runtime import load_production_station_catalog, load_station_catalog_manifest

          manifest = load_station_catalog_manifest()
          catalog = load_production_station_catalog()
          assert len(catalog) == manifest.station_count
          print(f"Catalog provenance PASS: {manifest.catalog_version}, {len(catalog):,} records, SHA-256 {manifest.csv_sha256}")
          PY

      - name: Validate Community Cloud deployment contract
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m json.tool deployment/streamlit-community-cloud.json >/dev/null
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          contract = json.loads((root / 'deployment/streamlit-community-cloud.json').read_text(encoding='utf-8'))
          config_path = root / contract['streamlit_config']
          config = tomllib.loads(config_path.read_text(encoding='utf-8'))

          assert contract['repository'] == 'dmitrievii/building-energy-tools'
          assert contract['branch'] == 'main'
          assert contract['entrypoint'] == 'tools/climate_analyzer/app.py'
          assert contract['python_version'] == '3.12'
          assert (root / contract['entrypoint']).is_file()
          assert (root / contract['dependency_file']).is_file()
          assert config_path == root / '.streamlit/config.toml'
          assert config['server']['headless'] is True
          assert config['server']['maxUploadSize'] == 10
          assert config['browser']['gatherUsageStats'] is False
          assert not (root / 'tools/climate_analyzer/.streamlit/config.toml').exists()
          print('Community Cloud deployment contract PASS')
          PY

      - name: Run security and scientific regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Import scientific modules
        run: |
          python - <<'PY'
          import epw_climate_analyzer.aggregations
          import epw_climate_analyzer.catalog_runtime
          import epw_climate_analyzer.charts
          import epw_climate_analyzer.climate_sources
          import epw_climate_analyzer.comparison
          import epw_climate_analyzer.decisions
          import epw_climate_analyzer.epw_parser
          import epw_climate_analyzer.interpretations
          import epw_climate_analyzer.psychrometrics
          import epw_climate_analyzer.release_info
          import epw_climate_analyzer.solar
          import epw_climate_analyzer.statistics
          print('Module import smoke PASS')
          PY

      - name: Start Streamlit from repository root and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          streamlit run tools/climate_analyzer/app.py --server.port=8501 > /tmp/climate-analyzer-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            cat /tmp/climate-analyzer-streamlit.log
            exit 1
          fi

          grep -qi 'ok' /tmp/health.txt
          echo 'Community Cloud root-launch health smoke PASS'
