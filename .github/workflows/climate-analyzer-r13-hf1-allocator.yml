name: Climate Analyzer R13 HF1 allocator screen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/climate-analyzer-r13-hf1-allocator.yml'
      - 'tools/climate_analyzer/scripts/mem_perf_r12_hf1_browser.mjs'
permissions:
  contents: read
jobs:
  real-app-allocator:
    strategy:
      fail-fast: false
      matrix:
        arena: ['default','2','4']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/climate_analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright-core@1.55.0
      - name: Matched real-app allocator screening
        env:
          ARENA_MODE: ${{ matrix.arena }}
          HF1_CYCLES: '6'
        run: |
          set -euo pipefail
          mkdir -p artifacts/mem-perf-r12-hf1
          cd ../..
          unset MALLOC_ARENA_MAX
          if [ "$ARENA_MODE" = default ]; then
            STREAMLIT_SERVER_DISCONNECTED_SESSION_TTL=0 python tools/climate_analyzer/scripts/run_managed_climate.py --server.headless=true --server.port=8513 > tools/climate_analyzer/artifacts/mem-perf-r12-hf1/server.log 2>&1 &
          else
            MALLOC_ARENA_MAX="$ARENA_MODE" STREAMLIT_SERVER_DISCONNECTED_SESSION_TTL=0 python tools/climate_analyzer/scripts/run_managed_climate.py --server.headless=true --server.port=8513 > tools/climate_analyzer/artifacts/mem-perf-r12-hf1/server.log 2>&1 &
          fi
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8513/_stcore/health && break; sleep 1; done
          cd tools/climate_analyzer
          node scripts/mem_perf_r12_hf1_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-arena-${{ matrix.arena }}
          path: tools/climate_analyzer/artifacts/mem-perf-r12-hf1/
