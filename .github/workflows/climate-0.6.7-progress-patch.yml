name: Climate 0.6.7 Progress Patch

on:
  push:
    branches:
      - feature/v0.6.7-geosphere-load-progress
    paths:
      - tools/climate_analyzer/scripts/patch_0_6_7_geosphere_progress.py
      - .github/workflows/climate-0.6.7-progress-patch.yml

permissions:
  contents: write

jobs:
  apply-progress-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.6.7-geosphere-load-progress
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply 0.6.7 patch
        run: python tools/climate_analyzer/scripts/patch_0_6_7_geosphere_progress.py

      - name: Validate patch
        run: |
          git diff --check
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer tools/climate_analyzer/tests
          cd tools/climate_analyzer
          python -m unittest tests.test_geosphere_transport_0_6_5 tests.test_geosphere_progress_0_6_7 -v

      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/geosphere.py \
                  tools/climate_analyzer/tests/test_geosphere_progress_0_6_7.py \
                  tools/climate_analyzer/CLIMATE_CORE_0_6_5.md \
                  tools/climate_analyzer/CLIMATE_CORE_0_6_7.md
          if git diff --cached --quiet; then
            echo "No production patch changes to commit."
          else
            git commit -m "Climate 0.6.7: add GeoSphere batch load progress"
            git push origin HEAD:feature/v0.6.7-geosphere-load-progress
          fi

      - name: Remove merged 0.6.5 feature branch
        run: |
          git push origin --delete feature/v0.6.5-canonical-hourly-analysis || true
