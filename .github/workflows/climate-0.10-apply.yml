name: CLIMATE-0.10 one-shot remediation

# Retry 3: upstream catalog failures are now logged with URL and exception.
on:
  push:
    branches:
      - climate-0.10-global-catalog-stable-map
    paths:
      - '.github/workflows/climate-0.10-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: climate-0.10-global-catalog-stable-map

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install production dependencies
        run: python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply stable map-state remediation
        run: python tools/climate_analyzer/scripts/_apply_climate_0_10.py

      - name: Build complete Climate.OneBuilding catalog
        working-directory: tools/climate_analyzer
        run: |
          python scripts/update_station_catalog.py --regions all

      - name: Validate generated global catalog
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          from epw_climate_analyzer.catalog_runtime import load_production_station_catalog, load_station_catalog_manifest
          manifest = load_station_catalog_manifest()
          catalog = load_production_station_catalog()
          assert manifest.catalog_kind == 'generated_provider_snapshot'
          assert manifest.station_count == len(catalog)
          assert len(catalog) > 10000, f'global catalog unexpectedly small: {len(catalog)}'
          assert manifest.build_evidence is not None
          assert manifest.build_evidence.get('failed_catalogs') == 0
          print(f'GLOBAL CATALOG PASS: {len(catalog):,} records')
          print(f'VERSION: {manifest.catalog_version}')
          print(f'SHA256: {manifest.csv_sha256}')
          PY

      - name: Compile and run Climate Analyzer tests
        run: |
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer
          cd tools/climate_analyzer
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Remove one-shot transport files
        run: |
          rm tools/climate_analyzer/scripts/_apply_climate_0_10.py
          rm .github/workflows/climate-0.10-apply.yml

      - name: Commit remediation and global catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/climate_sources.py \
                  tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.csv \
                  tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.meta.json \
                  tools/climate_analyzer/scripts/update_station_catalog.py \
                  tools/climate_analyzer/scripts/_apply_climate_0_10.py \
                  .github/workflows/climate-0.10-apply.yml
          git commit -m 'CLIMATE-0.10: stabilize map state and promote global catalog'
          git push origin HEAD:climate-0.10-global-catalog-stable-map
