name: IGE CMIP6 real Graz monthly anomalies
on:
  push:
    branches:
      - research/ige-cmip6-source-probe-20261010
    paths:
      - research/ige_cmip6/cckp_graz_live_extract.py
      - .github/workflows/ige-cmip6-graz-monthly-extract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-cckp-graz:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NetCDF scientific reader
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Download and extract real CCKP anomalies
        run: python research/ige_cmip6/cckp_graz_live_extract.py
      - name: Upload raw-numeric results and provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-cckp-graz-real-monthly-anomalies
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
