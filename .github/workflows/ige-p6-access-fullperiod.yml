name: IGE P6.1 ACCESS-CM2 100-year joint daily climate
on:
  push:
    branches: [research/ige-p6-access-fullperiod-20261010]
    paths:
      - research/ige_cmip6/p6_access_full_period.py
      - research/ige_cmip6/p6_access_full_period_audit.py
      - research/ige_cmip6/p6_access_p5_solar_reference.json
      - research/ige_cmip6/test_p6_access_full_period.py
      - .github/workflows/ige-p6-access-fullperiod.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-period:
    name: joint-daily ${{ matrix.window }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        window:
          - historical-1995-2014
          - ssp245-2040-2059
          - ssp245-2080-2099
          - ssp585-2040-2059
          - ssp585-2080-2099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific NASA NetCDF client
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'netCDF4>=1.6,<2'
      - name: Test source contracts, calendar, aggregation and historical GHI baseline
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p6_*.py' -v
      - name: Fetch synchronized raw daily NASA data, 20 years x nine variables
        run: python research/ige_cmip6/p6_access_full_period.py --window "${{ matrix.window }}" --workers 3
      - name: Preserve per-period CSV, QA and NASA SHA-256 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-access-${{ matrix.window }}
          path: outputs/p6_access_cm2/${{ matrix.window }}/
          retention-days: 14
          if-no-files-found: warn

  cross-window-audit:
    name: cross-window 900-source P6.1 scientific audit
    runs-on: ubuntu-latest
    needs: full-period
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download five 20-year research artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ige-p6-access-*
          path: p6_downloaded
          merge-multiple: false
      - name: Check provenance, 100-year completeness, solar P5 reference and CSV digests
        run: python research/ige_cmip6/p6_access_full_period_audit.py --artifacts-root p6_downloaded --output outputs/p6_access_audit/p6_full_closeout.json
      - name: Preserve validated 100-year closeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-access-100-year-closeout
          path: outputs/p6_access_audit/
          if-no-files-found: warn
