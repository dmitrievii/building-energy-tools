name: CLIMATE-GEOSPHERE-0.6.1 qualification

on:
  push:
    branches:
      - climate-geosphere-0.6.1-overview-range-coverage
    paths:
      - '.github/workflows/climate-geosphere-0.6.1-qualification.yml'
      - 'deployment/apply_geosphere_0_6_1_patch.py'
      - 'deployment/apply_geosphere_0_6_1_gap_hotfix.py'
      - 'deployment/apply_geosphere_0_6_1_runtime_capability_hotfix.py'
      - 'tools/climate_analyzer/app.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/geosphere.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/historical_capabilities.py'
      - 'tools/climate_analyzer/tests/test_geosphere_public_integration.py'
      - 'tools/climate_analyzer/tests/test_geosphere_0_6_1_overview_range_coverage.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.6.1-overview-range-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt
          python -m pip install pytest
      - name: Apply 0.6.1 base patch once
        run: |
          if grep -q 'CLIMATE_GEOSPHERE_0_6_1_PERMANENT' tools/climate_analyzer/tests/test_geosphere_0_6_1_overview_range_coverage.py 2>/dev/null; then
            echo 'Base patch already applied.'
          else
            python deployment/apply_geosphere_0_6_1_patch.py
            python deployment/apply_geosphere_0_6_1_gap_hotfix.py
            printf '\n# CLIMATE_GEOSPHERE_0_6_1_PERMANENT\n' >> tools/climate_analyzer/tests/test_geosphere_0_6_1_overview_range_coverage.py
          fi
      - name: Apply optional-psychrometric runtime hotfix
        run: python deployment/apply_geosphere_0_6_1_runtime_capability_hotfix.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: Focused GeoSphere 0.6.1 tests
        env:
          PYTHONPATH: tools/climate_analyzer
        run: |
          python -m pytest -q \
            tools/climate_analyzer/tests/test_geosphere_0_6_1_overview_range_coverage.py \
            tools/climate_analyzer/tests/test_geosphere_public_integration.py \
            tools/climate_analyzer/tests/test_geosphere_adapter.py \
            tools/climate_analyzer/tests/test_historical_wind_solar_capabilities.py \
            tools/climate_analyzer/tests/test_cadence_duration_metrics.py \
            tools/climate_analyzer/tests/test_cadence_aware_interpretations.py \
            tools/climate_analyzer/tests/test_cadence_frequency_visuals.py
      - name: Full Climate Analyzer regression suite
        env:
          PYTHONPATH: tools/climate_analyzer
        run: python -m pytest -q tools/climate_analyzer/tests
      - name: Commit qualified permanent candidate
        run: |
          git config user.name 'dmitrievii'
          git config user.email 'dmitriev.ivashka@gmail.com'
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git add tools/climate_analyzer/app.py \
                    tools/climate_analyzer/epw_climate_analyzer/geosphere.py \
                    tools/climate_analyzer/epw_climate_analyzer/historical_capabilities.py \
                    tools/climate_analyzer/tests/test_geosphere_public_integration.py \
                    tools/climate_analyzer/tests/test_geosphere_0_6_1_overview_range_coverage.py
            if ! git diff --cached --quiet; then
              git commit -m 'CLIMATE-GEOSPHERE-0.6.1: historical overview range and coverage'
              git push origin HEAD:climate-geosphere-0.6.1-overview-range-coverage
            fi
          fi
