name: CLIMATE-CORE-0.2 branch remediation

on:
  push:
    branches:
      - climate-core-0.2-canonical-climate-model

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-core-0.2-canonical-climate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply canonical-model integration patch
        run: python tools/climate_analyzer/_core_model_patch.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: Focused canonical-model regression
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_canonical_climate_model tests.test_time_series_overlay
      - name: Full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove temporary remediation files
        run: |
          rm tools/climate_analyzer/_core_model_patch.py
          rm .github/workflows/climate-core-0.2-remediation.yml
      - name: Commit validated canonical model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "CLIMATE-CORE-0.2: integrate canonical climate model"
            git push origin HEAD:climate-core-0.2-canonical-climate-model
          fi
