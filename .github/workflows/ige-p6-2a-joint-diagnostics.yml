name: IGE P6.2A multivariate daily physics and GeoSphere station bridge
on:
  push:
    branches:
      - research/ige-p6-2a-multivariate-audit-20261010
    paths:
      - .github/workflows/ige-p6-2a-joint-diagnostics.yml
      - research/ige_cmip6/p6_2a_joint_diagnostics.py
      - research/ige_cmip6/p6_2a_geosphere_monthly.py
      - research/ige_cmip6/test_p6_2a.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observed-multivariate-pilot:
    name: NASA full-period coherence + GeoSphere Graz monthly residuals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run P6.2A offline scientific contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p6_2a.py' -v
      - name: Download original accepted P6.1 historical ACCESS-CM2 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          name: ige-p6-access-historical-1995-2014
          path: inputs/historical
      - name: Download original accepted P6.1 future ACCESS-CM2 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          name: ige-p6-access-ssp585-2080-2099
          path: inputs/future
      - name: Analyze complete multivariate daily source, without fitting or editing
        run: |
          python research/ige_cmip6/p6_2a_joint_diagnostics.py \
            --historical inputs/historical/joint_daily_raw.csv \
            --future inputs/future/joint_daily_raw.csv \
            --output outputs/p6_2a/daily_multivariate_audit.json
      - name: Independently obtain observed GeoSphere station 30 1995-2014 monthly data
        run: |
          python research/ige_cmip6/p6_2a_geosphere_monthly.py \
            --model-climatology inputs/historical/model_monthly_climatology.csv \
            --out outputs/p6_2a/geosphere_station30
      - name: Preserve P6.2A diagnostics and raw provider provenance, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-2a-access-multivariate-geosphere-residual-pilot
          path: outputs/p6_2a/
          retention-days: 30
          if-no-files-found: warn
