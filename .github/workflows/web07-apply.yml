name: WEB-0.7 Apply Public Release Notice

on:
  push:
    branches:
      - web-0.7-public-identity-legal-methodology
    paths:
      - '.github/workflows/web07-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web-0.7-public-identity-legal-methodology
          fetch-depth: 0

      - name: Apply deterministic publication UI transform
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/climate_analyzer/app.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''from epw_climate_analyzer.ui_contract import (\n    APP_BROWSER_TITLE,\n    APP_INTRO,\n    APP_NAME,\n    APP_TAGLINE,\n''',
                  '''from epw_climate_analyzer.ui_contract import (\n    APP_BROWSER_TITLE,\n    APP_ENGINEERING_DISCLAIMER,\n    APP_INDEPENDENCE_NOTICE,\n    APP_INTRO,\n    APP_NAME,\n    APP_RELEASE_LABEL,\n    APP_TAGLINE,\n''',
              ),
              (
                  '''    st.write(APP_INTRO)\n    st.caption(\n        "Start with an EPW weather file from your computer or select a climate from the reviewed "\n''',
                  '''    st.write(APP_INTRO)\n    st.caption(APP_RELEASE_LABEL)\n    with st.expander("About this beta", expanded=False):\n        st.write(APP_ENGINEERING_DISCLAIMER)\n        st.caption(APP_INDEPENDENCE_NOTICE)\n    st.caption(\n        "Start with an EPW weather file from your computer or select a climate from the reviewed "\n''',
              ),
              (
                  '''    st.sidebar.caption("Building Energy Tools")\n    st.sidebar.title(APP_NAME)\n    apply_queued_navigation(st.session_state)\n''',
                  '''    st.sidebar.caption("Building Energy Tools")\n    st.sidebar.title(APP_NAME)\n    st.sidebar.caption(APP_RELEASE_LABEL)\n    apply_queued_navigation(st.session_state)\n''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {text.count(old)} for transform anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer

      - name: Remove one-time workflow
        run: rm .github/workflows/web07-apply.yml

      - name: Commit publication UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WEB-0.7: expose beta status and publication notices'
          git push origin HEAD:web-0.7-public-identity-legal-methodology
