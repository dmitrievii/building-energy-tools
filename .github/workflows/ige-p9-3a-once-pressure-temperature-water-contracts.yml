name: IGE P9.3A one-shot offline joint pressure temperature water-vapour contracts
# Research annual physics test complete. Only explicit manual reruns.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint_pressure_temperature_water_physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic SciPy SLSQP numerical constraint solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Eleven original-source pressure immutable and coupled humidity temperature contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_3a_pressure_temperature_q_joint.py' -v
      - name: No regression P9.2C 9 physical donor and humidity tests
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2c_physical_donor_and_humidity.py' -v
      - name: No regression P9.2B 16 climate mass and solar tests
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2b_cmip6_daily_joint_regimes.py' -v
      - name: No regression P9.2D seven 8760x35 EPWCET tests
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2d_annual_cet_epw_export.py' -v
