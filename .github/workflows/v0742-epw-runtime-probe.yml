name: Climate 0.7.4.2 real EPW runtime probe

on:
  push:
    branches:
      - hotfix/v0.7.4.2-psychrometric-stale-module-guard
    paths:
      - 'deployment/v0742_epw_runtime_probe.py'
      - '.github/workflows/v0742-epw-runtime-probe.yml'

permissions:
  contents: read

jobs:
  real-epw-psychrometric-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools/climate_analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/climate_analyzer/requirements.txt
      - name: Exercise production EPW path and psychrometric chart
        run: python deployment/v0742_epw_runtime_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0742-real-epw-runtime-probe
          path: artifacts/v0742-epw-runtime-probe.json
          if-no-files-found: warn
          retention-days: 7
