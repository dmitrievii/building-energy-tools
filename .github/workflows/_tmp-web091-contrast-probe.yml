name: WEB-0.9.1 Apply Accessibility Patch

on:
  push:
    branches:
      - web-0.9.1-accessibility-closure
    paths:
      - '.github/workflows/_tmp-web091-contrast-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact source patch
        run: python deployment/_tmp_web091_apply_patch.py

      - name: Verify focused source contract
        run: |
          python -m py_compile tools/climate_analyzer/app.py tools/climate_analyzer/tests/test_accessibility_override_contract.py
          python -m unittest discover -s tools/climate_analyzer/tests -p 'test_accessibility_override_contract.py'

      - name: Remove temporary diagnostic transport
        run: |
          rm -f deployment/_tmp_web091_contrast_probe.mjs
          rm -f deployment/_tmp_web091_apply_patch.py
          rm -f .github/workflows/_tmp-web091-contrast-probe.yml

      - name: Commit final WEB-0.9.1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'WEB-0.9.1: restore uploader hint contrast'
          git push origin HEAD:web-0.9.1-accessibility-closure
