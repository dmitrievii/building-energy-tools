name: v0.7.4-A CI contract cleanup

on:
  push:
    branches:
      - fix/v0.7.4-temporal-ux-psychrometric-remediation
    paths:
      - .github/workflows/v074a-ci-contract-cleanup.yml
      - tools/climate_analyzer/scripts/fix_v074a_ci_contracts.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4-temporal-ux-psychrometric-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused cleanup
        run: python tools/climate_analyzer/scripts/fix_v074a_ci_contracts.py
      - name: Self-clean transport
        run: |
          rm -f tools/climate_analyzer/scripts/fix_v074a_ci_contracts.py
          rm -f .github/workflows/v074a-ci-contract-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(climate): align v0.7.4-A temporal contracts"
          git push
