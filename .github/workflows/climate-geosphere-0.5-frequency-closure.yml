name: CLIMATE-GEOSPHERE-0.5 frequency-duration closure

on:
  push:
    branches:
      - climate-geosphere-0.5-cadence-aware-interpretations

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.5-cadence-aware-interpretations
          fetch-depth: 0

      - name: Apply frequency-duration closure patch
        run: python tools/climate_analyzer/remediation/geosphere_0_5_frequency_layer_patch.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -r tools/climate_analyzer/requirements.txt
          python -m pip install pytest

      - name: Compile source
        run: python -m compileall -q tools/climate_analyzer

      - name: Run focused cadence-frequency regressions
        working-directory: tools/climate_analyzer
        run: |
          python -m pytest -q \
            tests/test_cadence_frequency_visuals.py \
            tests/test_cadence_aware_interpretations.py \
            tests/test_cadence_duration_metrics.py \
            tests/test_geosphere_public_integration.py \
            tests/test_degree_metrics_controls.py

      - name: Run full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m pytest -q

      - name: Remove one-shot infrastructure
        run: |
          rm -f tools/climate_analyzer/remediation/geosphere_0_5_frequency_layer_patch.py
          rm -f .github/workflows/climate-geosphere-0.5-frequency-closure.yml
          find tools/climate_analyzer -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools/climate_analyzer -type d -name .pytest_cache -prune -exec rm -rf {} +
          find tools/climate_analyzer -type f -name '*.pyc' -delete

      - name: Commit qualified permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes to commit" >&2
            exit 1
          fi
          git commit -m "CLIMATE-GEOSPHERE-0.5: close sub-hourly frequency semantics"
          git push origin HEAD:climate-geosphere-0.5-cadence-aware-interpretations
