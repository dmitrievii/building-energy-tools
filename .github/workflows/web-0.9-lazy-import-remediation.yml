name: WEB09 Lazy Import Remediation

on:
  push:
    branches:
      - web-0.9-runtime-performance
    paths:
      - .github/workflows/web-0.9-lazy-import-remediation.yml
      - deployment/apply_web09_lazy_import_patch.py

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: web-0.9-runtime-performance
          fetch-depth: 1

      - name: Apply patch
        run: python deployment/apply_web09_lazy_import_patch.py

      - name: Compile
        run: python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer

      - name: Remove temporary patch transport
        run: git rm .github/workflows/web-0.9-lazy-import-remediation.yml deployment/apply_web09_lazy_import_patch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git commit -m "WEB-0.9: lazy-load map and analysis dependencies"
          git push origin HEAD:web-0.9-runtime-performance
