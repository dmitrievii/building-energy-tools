name: CLIMATE-0.10.5 Psychrometric Width Hotfix

on:
  push:
    branches:
      - climate-0.10.5-psychrometric-streamlit-width

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.10.5-psychrometric-streamlit-width
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply psychrometric width remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('tools/climate_analyzer/app.py')
          text = app.read_text(encoding='utf-8')
          old = 'st.plotly_chart(fig, use_container_width=False, config={"displaylogo": False, "scrollZoom": True}, key=next_plot_key("psychrometric"))'
          new = 'st.plotly_chart(fig, use_container_width=True, config={"displaylogo": False, "scrollZoom": True}, key=next_plot_key("psychrometric"))'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one fixed-width psychrometric render call, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tools/climate_analyzer/tests/test_climate_0_10_5_regressions.py')
          test.write_text('''import ast\nimport unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass Climate0105RegressionTests(unittest.TestCase):\n    def test_primary_psychrometric_chart_uses_container_width(self):\n        source = (ROOT / "app.py").read_text(encoding="utf-8")\n        tree = ast.parse(source)\n        fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "render_humidity")\n        calls = []\n        for node in ast.walk(fn):\n            if not isinstance(node, ast.Call):\n                continue\n            func = node.func\n            if not (isinstance(func, ast.Attribute) and func.attr == "plotly_chart"):\n                continue\n            if not any(isinstance(kw.value, ast.Call) and isinstance(kw.value.func, ast.Name) and kw.value.func.id == "next_plot_key" and kw.value.args and isinstance(kw.value.args[0], ast.Constant) and kw.value.args[0].value == "psychrometric" for kw in node.keywords if kw.arg == "key"):\n                continue\n            calls.append(node)\n        self.assertEqual(len(calls), 1)\n        width_kw = next((kw for kw in calls[0].keywords if kw.arg == "use_container_width"), None)\n        self.assertIsNotNone(width_kw)\n        self.assertIsInstance(width_kw.value, ast.Constant)\n        self.assertIs(width_kw.value.value, True)\n\n    def test_no_fixed_width_primary_psychrometric_render_remains(self):\n        source = (ROOT / "app.py").read_text(encoding="utf-8")\n        self.assertNotIn('next_plot_key("psychrometric"))\\n        if False', source)\n        self.assertNotIn('use_container_width=False, config={"displaylogo": False, "scrollZoom": True}, key=next_plot_key("psychrometric")', source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Compile Python sources
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts
      - name: Focused CLIMATE-0.10.5 regression
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_climate_0_10_5_regressions -v
      - name: Full regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit validated hotfix
        run: |
          git rm .github/workflows/climate-0.10.5-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git add tools/climate_analyzer/tests/test_climate_0_10_5_regressions.py
          git commit -m "CLIMATE-0.10.5: stretch psychrometric chart to container"
          git push origin HEAD:climate-0.10.5-psychrometric-streamlit-width
