name: Climate 0.7.1 Source Retry Patch

on:
  push:
    branches:
      - feature/v0.7.1-geosphere-precip-snow-live-smoke
    paths:
      - tools/climate_analyzer/scripts/patch_0_7_1_source_retry.py
      - .github/workflows/climate-0.7.1-source-retry-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-geosphere-precip-snow-live-smoke
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source retry patch
        run: python tools/climate_analyzer/scripts/patch_0_7_1_source_retry.py
      - name: Validate smoke syntax and contract
        run: |
          node --check deployment/geosphere_precip_snow_live_smoke.mjs
          python -m unittest tools.climate_analyzer.tests.test_geosphere_precip_snow_live_smoke_0_7_1
          git diff --check
      - name: Commit smoke change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/geosphere_precip_snow_live_smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Climate 0.7.1: retry source selection through Streamlit reruns'
            git push origin HEAD:feature/v0.7.1-geosphere-precip-snow-live-smoke
          fi
