name: IGE P6.2D independent solar correction M0 M1 QDM heldout validation
on:
  push:
    branches:
      - research/ige-p6-2d-solar-bias-benchmark-20261010
    paths:
      - .github/workflows/ige-p6-2d-solar-bias-benchmark.yml
      - research/ige_cmip6/p6_2d_solar_methods_benchmark.py
      - research/ige_cmip6/test_p6_2d_solar_methods_benchmark.py
      - docs/IGE_P6_2D_SOLAR_METHOD_HOLDOUT_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  solar-method-selection:
    name: Station/GCM unpaired holdout comparison 1995-2004 vs 2005-2014
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research science contracts and future ratio preservation
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p6_2d_solar_methods_benchmark.py' -v
      - name: Original vetted GeoSphere Graz station q21=20 daily solar
        uses: actions/download-artifact@v4
        with:
          run-id: 38084157993
          github-token: ${{ github.token }}
          name: ige-p6-2b-graz-1995-2014-verified-solar-eight-gcm-closeout
          path: inputs/station
      - name: Original vetted ACCESS-CM2 historical GHI
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          name: ige-p6-access-historical-1995-2014
          path: inputs/access/ige-p6-access-historical-1995-2014
      - name: Original vetted seven NEX-GDDP model historical GHI
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ github.token }}
          pattern: ige-p6-*-historical-1995-2014
          path: inputs/seven_original
          merge-multiple: false
      - name: Accepted repairs to EC-Earth3, IPSL-CM6A-LR and MPI-ESM1-2-HR histories
        uses: actions/download-artifact@v4
        with:
          run-id: 38077903914
          github-token: ${{ github.token }}
          pattern: ige-p6-*-historical-1995-2014
          path: inputs/seven_repaired
          merge-multiple: false
      - name: Run strictly unpaired eight-model empirical solar-method validation
        run: |
          python research/ige_cmip6/p6_2d_solar_methods_benchmark.py \
            --station-csv inputs/station/station30_1995_2014_daily_solar_qc.csv \
            --access inputs/access \
            --original inputs/seven_original \
            --repaired inputs/seven_repaired \
            --out outputs/ige_p6_2d_solar_methods
      - name: Preserve 8-model method comparison and hashed independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-2d-solar-methods-eight-gcm-1995-2014-holdout
          path: outputs/ige_p6_2d_solar_methods/
          retention-days: 30
          if-no-files-found: warn
