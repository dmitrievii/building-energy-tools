name: CLIMATE-0.10.11 four-input degree metrics remediation

on:
  push:
    branches:
      - climate-0.10.11-four-input-degree-metrics

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.10.11-four-input-degree-metrics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply HGT/KGT four-input UI patch
        run: python tools/climate_analyzer/_degree_four_input_patch.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: Focused degree-metric regression
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_degree_metrics_controls
      - name: Full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove temporary remediation files
        run: |
          rm tools/climate_analyzer/_degree_four_input_patch.py
          rm .github/workflows/climate-0.10.11-degree-metrics-remediation.yml
      - name: Commit validated HGT/KGT correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "CLIMATE-0.10.11: correct HGT/KGT four-input semantics"
            git push origin HEAD:climate-0.10.11-four-input-degree-metrics
          fi
