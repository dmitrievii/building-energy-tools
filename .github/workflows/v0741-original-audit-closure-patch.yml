name: Climate 0.7.4.1 original-audit closure patch

on:
  push:
    branches:
      - fix/v0.7.4.1-psychrometric-integration-remediation
    paths:
      - 'tools/climate_analyzer/scripts/apply_v0741_original_audit_closure.py'
      - '.github/workflows/v0741-original-audit-closure-patch.yml'

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4.1-psychrometric-integration-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply original-audit closure patch
        working-directory: tools/climate_analyzer
        run: python scripts/apply_v0741_original_audit_closure.py
      - name: Install dependencies
        working-directory: tools/climate_analyzer
        run: pip install -r requirements.txt
      - name: Compile changed runtime
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests/test_original_audit_closure_0_7_4_1.py
      - name: Run original-audit and related regression contracts
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest discover -s tests -p 'test_original_audit_closure_0_7_4_1.py' -v
          python -m unittest discover -s tests -p 'test_temporal_ux_0_7_4.py' -v
          python -m unittest discover -s tests -p 'test_source_neutral_ui_0_7_4.py' -v
          python -m unittest discover -s tests -p 'test_ux_cleanup_0_7_4_c1.py' -v
          python -m unittest discover -s tests -p 'test_time_series_styling_0_7_4_c2.py' -v
          python -m unittest discover -s tests -p 'test_ux_cleanup_0_7_4_c3.py' -v
          python -m unittest discover -s tests -p 'test_psychrometric_redesign_0_7_4.py' -v
          python -m unittest discover -s tests -p 'test_psychrometric_integration_0_7_4_1.py' -v
      - name: Remove temporary transport and commit qualified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/climate_analyzer/scripts/apply_v0741_original_audit_closure.py .github/workflows/v0741-original-audit-closure-patch.yml
          git add tools/climate_analyzer/app.py tools/climate_analyzer/CLIMATE_CORE_0_7_4.md tools/climate_analyzer/tests/test_original_audit_closure_0_7_4_1.py
          git commit -m 'fix: close remaining 0.7.4 audit gaps'
          git push origin HEAD:fix/v0.7.4.1-psychrometric-integration-remediation
