name: CLIMATE-GEOSPHERE-0.2 remediation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.2-batched-historical-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply patch
        run: python tools/climate_analyzer/_geosphere02_patch.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: GeoSphere focused tests
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_geosphere_adapter
      - name: Full Climate Analyzer tests
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove one-shot remediation files
        run: |
          rm tools/climate_analyzer/_geosphere02_patch.py
          rm .github/workflows/climate-geosphere-0.2-remediation.yml
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "CLIMATE-GEOSPHERE-0.2: batch historical station requests"
            git push origin HEAD:climate-geosphere-0.2-batched-historical-selection
          fi
