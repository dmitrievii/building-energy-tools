name: CLIMATE-0.6.1 fresh Folium render qualification

on:
  push:
    branches:
      - climate-0.6.1-folium-fresh-render-hotfix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.6.1-folium-fresh-render-hotfix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply hotfix
        run: python .github/remediation/climate_0_6_1_fresh_folium.py
      - name: Compile
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts
      - name: Focused cache/snapshot tests
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest tests.test_onebuilding_map_cache_contract -v
          python -m unittest tests.test_climate_0_10_12_memory_hotfix -v
      - name: Full regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove one-shot infrastructure
        run: |
          git rm .github/workflows/climate-0.6.1-fresh-folium-qualify.yml
          git rm .github/remediation/climate_0_6_1_fresh_folium.py
      - name: Commit qualified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py tools/climate_analyzer/tests/test_onebuilding_map_cache_contract.py
          git add -u .github
          git commit -m "CLIMATE-0.6.1: keep Folium map fresh across reruns"
          git push origin HEAD:climate-0.6.1-folium-fresh-render-hotfix
