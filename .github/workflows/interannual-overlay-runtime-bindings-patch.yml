name: Interannual Overlay Runtime Bindings Patch

on:
  push:
    branches: [feat/interannual-overlay]
    paths:
      - '.github/workflows/interannual-overlay-runtime-bindings-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interannual-overlay
          fetch-depth: 0
      - name: Apply exact interannual runtime bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          monthly = 'tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_canonical.py'
          replace_once(
              monthly,
              '[legacy.CHRONOLOGICAL, legacy.CALENDAR_PROFILE],',
              '[legacy.CHRONOLOGICAL, legacy.CALENDAR_PROFILE, legacy.INTERANNUAL_OVERLAY],',
          )
          replace_once(
              monthly,
              '"Chronological keeps every published month in sequence. Calendar profile aligns the same calendar month "\n                "across source years for multi-year monthly statistics."',
              '"Chronological keeps every published month in sequence. Calendar profile combines equivalent calendar months "\n                "according to the existing profile rules. Interannual overlay keeps every real year independent and "\n                "aligns its published monthly observations on the common Jan–Dec axis without cross-year averaging."',
          )

          timeseries = 'tools/climate_analyzer/epw_climate_analyzer/timeseries.py'
          replace_once(
              timeseries,
              '''def available_resolution_labels(index: pd.DatetimeIndex) -> list[str]:\n    """Return only resolutions at or coarser than the native source timestep."""\n    native = native_resolution_minutes(index)\n    labels = ["Native"]\n    labels.extend(spec.label for spec in RESOLUTIONS[1:] if spec.nominal_minutes >= native)\n    return labels\n''',
              '''def available_resolution_labels(source: pd.DatetimeIndex | pd.DataFrame) -> list[str]:\n    """Return resolutions at or coarser than the declared source cadence.\n\n    Calendar-native monthly data are not a fixed 30-day cadence.  Their published\n    monthly observations therefore expose Monthly/Seasonal/Annual directly while\n    still blocking all artificial sub-monthly upsampling.\n    """\n    if isinstance(source, pd.DataFrame):\n        index = pd.DatetimeIndex(source.index)\n        native_calendar = str(source.attrs.get("canonical_native_resolution", "")).strip().lower()\n        if native_calendar == "monthly":\n            return ["Native", "Monthly", "Seasonal", "Annual"]\n        declared = source.attrs.get("canonical_native_interval_minutes")\n        try:\n            native = int(declared) if declared is not None else native_resolution_minutes(index)\n        except (TypeError, ValueError):\n            native = native_resolution_minutes(index)\n    else:\n        index = pd.DatetimeIndex(source)\n        native = native_resolution_minutes(index)\n    labels = ["Native"]\n    labels.extend(spec.label for spec in RESOLUTIONS[1:] if spec.nominal_minutes >= native)\n    return labels\n''',
          )

          app = 'tools/climate_analyzer/app.py'
          replace_once(
              app,
              'resolutions = available_resolution_labels(pd.DatetimeIndex(df.index))',
              'resolutions = available_resolution_labels(df)',
          )

          charts = 'tools/climate_analyzer/epw_climate_analyzer/charts.py'
          replace_once(
              charts,
              'from .temporal_filtering import CALENDAR_PROFILE, CHRONOLOGICAL, display_period_labels, is_multiyear, time_basis\n',
              'from .temporal_filtering import CALENDAR_PROFILE, CHRONOLOGICAL, INTERANNUAL_OVERLAY, display_period_labels, is_multiyear, time_basis\nfrom .interannual_profiles import interannual_minmax_figure, interannual_percentile_figure\n',
          )
          replace_once(
              charts,
              '''    if extensive:\n        summary = aggregate_sum(df, column, aggregation)\n        central = "sum" if aggregation != "Hourly" else "mean"\n    else:\n        summary = aggregate_summary(df, column, aggregation)\n        central = "mean"\n''',
              '''    if time_basis(df) == INTERANNUAL_OVERLAY:\n        return interannual_minmax_figure(df, column, aggregation, title, unit)\n\n    if extensive:\n        summary = aggregate_sum(df, column, aggregation)\n        central = "sum" if aggregation != "Hourly" else "mean"\n    else:\n        summary = aggregate_summary(df, column, aggregation)\n        central = "mean"\n''',
          )
          replace_once(
              charts,
              '''def percentile_band_chart(df: pd.DataFrame, column: str, aggregation: str, title: str, unit: str) -> go.Figure:\n    """Create a percentile-band chart using P05, median and P95."""\n    summary = aggregate_summary(df, column, aggregation)\n''',
              '''def percentile_band_chart(df: pd.DataFrame, column: str, aggregation: str, title: str, unit: str) -> go.Figure:\n    """Create a percentile-band chart using P05, median and P95."""\n    if time_basis(df) == INTERANNUAL_OVERLAY:\n        return interannual_percentile_figure(df, column, aggregation, title, unit)\n    summary = aggregate_summary(df, column, aggregation)\n''',
          )
          PY
      - name: Verify focused tests before commit
        env:
          PYTHONPATH: tools/climate_analyzer
        run: |
          python -m pip install -q -r tools/climate_analyzer/requirements.txt
          python -m unittest -v \
            tools.climate_analyzer.tests.test_interannual_overlay \
            tools.climate_analyzer.tests.test_interannual_overlay_profiles
      - name: Commit runtime bindings and remove patch transport
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/charts.py \
                  tools/climate_analyzer/epw_climate_analyzer/timeseries.py \
                  tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_canonical.py
          git rm .github/workflows/interannual-overlay-runtime-bindings-patch.yml
          git commit -m 'Climate: bind interannual overlay across temporal charts'
          git push origin HEAD:feat/interannual-overlay
