name: WEB-0.6 Apply Navigation State Fix

on:
  push:
    branches:
      - web-0.6-public-ux
    paths:
      - '.github/workflows/web06-statefix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web-0.6-public-ux
          fetch-depth: 0

      - name: Apply navigation state fix
        run: |
          set -euo pipefail
          python .web06_statefix.py
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer/ui_contract.py

      - name: Remove one-time files
        run: |
          rm .web06_statefix.py
          rm .github/workflows/web06-statefix.yml

      - name: Commit navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WEB-0.6: make climate selection navigation rerun-safe'
          git push origin HEAD:web-0.6-public-ux
