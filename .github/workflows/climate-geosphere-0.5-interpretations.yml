name: CLIMATE-GEOSPHERE-0.5 cadence-aware interpretations

on:
  push:
    branches:
      - climate-geosphere-0.5-cadence-aware-interpretations

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r tools/climate_analyzer/requirements.txt
          python -m pip install pytest

      - name: Compile source
        run: python -m compileall -q tools/climate_analyzer

      - name: Run focused interpretation and cadence regressions
        working-directory: tools/climate_analyzer
        run: |
          python -m pytest -q \
            tests/test_cadence_aware_interpretations.py \
            tests/test_cadence_duration_metrics.py \
            tests/test_geosphere_public_integration.py \
            tests/test_degree_metrics_controls.py

      - name: Run full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m pytest -q
