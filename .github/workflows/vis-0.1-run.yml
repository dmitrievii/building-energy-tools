name: VIS-0.1 Semantic Chart Colours Runner

on:
  push:
    branches:
      - climate-vis-0.1-semantic-chart-colors

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Patch production chart builders
        run: python tools/climate_analyzer/scripts/apply_semantic_chart_colors.py

      - name: Compile Python
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts

      - name: Focused semantic colour regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_semantic_chart_colors.py' -v

      - name: Full Climate Analyzer regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Import smoke
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          import epw_climate_analyzer.chart_theme
          import epw_climate_analyzer.charts
          import epw_climate_analyzer.comparison
          print('VIS-0.1 import smoke PASS')
          PY

      - name: Commit validated remediation
        run: |
          rm tools/climate_analyzer/scripts/apply_semantic_chart_colors.py
          rm .github/workflows/vis-0.1-run.yml
          rm .github/workflows/vis-0.1-semantic-chart-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VIS-0.1: apply semantic chart colours"
          git push origin HEAD:climate-vis-0.1-semantic-chart-colors
