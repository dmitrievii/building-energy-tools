name: Climate Analyzer Live Browser Audit

on:
  push:
    branches:
      - web-0.8.1-live-deployment-audit
    paths:
      - '.github/workflows/climate-analyzer-live-audit.yml'
      - 'deployment/live_browser_audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://building-climate-analyzer.streamlit.app/
      AUDIT_OUTPUT_DIR: artifacts/live-audit
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Chrome version
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Install browser-audit dependencies
        run: npm install --no-save playwright-core@1.55.0 axe-core@4.10.3

      - name: Run live browser audit
        run: node deployment/live_browser_audit.mjs

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-live-audit
          path: artifacts/live-audit
          if-no-files-found: warn
          retention-days: 14
