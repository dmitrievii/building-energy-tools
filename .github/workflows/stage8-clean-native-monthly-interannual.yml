name: Stage8 Clean Native Monthly Interannual Acceptance

on:
  push:
    branches:
      - fix/interannual-overlay-native-monthly-clean-stage-8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage8-clean-native-monthly-interannual
  cancel-in-progress: true

jobs:
  clean-native-monthly-acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools/climate_analyzer
      TARGET_URL: http://127.0.0.1:8501/
      CHROME_PATH: /usr/bin/google-chrome
      PR83_MONTHLY_FIXTURE: artifacts/pr83-contract-smoke/monthly-provider.json
      PR83_MONTHLY_LOAD_REPORT: artifacts/pr83-contract-smoke/monthly-selected-load.json

    steps:
      - name: Checkout clean candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Materialize candidate once
        run: |
          python deployment/stage8_materialize_native_monthly.py
          python deployment/stage8_harden_browser_smoke.py
          python deployment/stage8_monthly_capability_contract.py
          python deployment/stage8_data_plane_oracle.py

      - name: Prove candidate is direct and clean
        run: |
          node --check deployment/pr83_monthly_selected_load_smoke.mjs
          grep -q "resolution_ui = await inspectResolutionControl(page)" deployment/pr83_monthly_selected_load_smoke.mjs
          ! grep -q "setResolution(" deployment/pr83_monthly_selected_load_smoke.mjs
          grep -q 'MONTHLY_OVERLAY_RESOLUTIONS = ("Native", "Monthly", "Seasonal", "Annual")' tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_cleanup.py
          grep -q 'resolution_options = list(monthly_overlay_resolution_options(column))' tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_cleanup.py
          ! grep -q 'monthly_overlay_resolution_key' tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_cleanup.py
          grep -q 'Source resolution: calendar month' tools/climate_analyzer/app.py
          grep -q 'key="overlay_start_month"' tools/climate_analyzer/app.py
          grep -q 'selected_end + pd.offsets.MonthBegin(1)' tools/climate_analyzer/app.py
          git diff --check
          git diff -- \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_cleanup.py \
            tools/climate_analyzer/epw_climate_analyzer/timeseries.py \
            tools/climate_analyzer/tests/test_geosphere_monthly_cleanup_0_7_5_4.py \
            tools/climate_analyzer/tests/test_interannual_overlay.py \
            deployment/pr83_monthly_selected_load_smoke.mjs

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Run deterministic Interannual contracts
        env:
          PYTHONWARNINGS: error::FutureWarning
        run: |
          python -m unittest -v \
            tools.climate_analyzer.tests.test_geosphere_monthly_cleanup_0_7_5_4 \
            tools.climate_analyzer.tests.test_interannual_overlay \
            tools.climate_analyzer.tests.test_interannual_overlay_profiles \
            tools.climate_analyzer.tests.test_time_series_overlay \
            tools.climate_analyzer.tests.test_source_parity_streamlit_rerun_reset_0_7_5_5

      - name: Probe live GeoSphere native-monthly data
        run: python deployment/pr83_monthly_contract_probe.py

      - name: Start clean candidate Streamlit
        run: |
          mkdir -p artifacts/pr83-contract-smoke
          nohup python -m streamlit run tools/climate_analyzer/app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > artifacts/pr83-contract-smoke/streamlit.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/pr83-contract-smoke/streamlit.log || true
          exit 1

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Exercise complete 2020-2025 native-monthly acceptance
        run: node deployment/pr83_monthly_selected_load_smoke.mjs

      - name: Reject runtime tracebacks
        run: |
          if grep -E 'Traceback \(most recent call last\)|Uncaught app execution' artifacts/pr83-contract-smoke/streamlit.log; then
            cat artifacts/pr83-contract-smoke/streamlit.log
            exit 1
          fi

      - name: Promote exact tested bytes and remove bootstrap machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/source_parity_monthly_cleanup.py \
            tools/climate_analyzer/epw_climate_analyzer/timeseries.py \
            tools/climate_analyzer/tests/test_geosphere_monthly_cleanup_0_7_5_4.py \
            tools/climate_analyzer/tests/test_interannual_overlay.py \
            deployment/pr83_monthly_selected_load_smoke.mjs
          git rm \
            deployment/stage8_materialize_native_monthly.py \
            deployment/stage8_harden_browser_smoke.py \
            deployment/stage8_overlay_resolution_context.py \
            deployment/stage8_monthly_capability_contract.py \
            deployment/stage8_data_plane_oracle.py \
            .github/workflows/stage8-clean-native-monthly-interannual.yml
          git diff --cached --check
          git commit -m 'Climate: close native monthly interannual acceptance'
          git push

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-clean-native-monthly-interannual
          path: artifacts/pr83-contract-smoke
          if-no-files-found: warn
          retention-days: 14
