name: CLIMATE-0.6.2 persistent map qualification

on:
  push:
    branches:
      - climate-0.6.2-persistent-map-finalwork
    paths:
      - '.github/workflows/climate-0.6.2-persistent-map-qualify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.6.2-persistent-map-finalwork
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
          pip install pytest
      - name: Apply persistent-map patch
        run: python tools/climate_analyzer/scripts/apply_climate_0_6_2_persistent_map.py
      - name: Compile
        run: python -m py_compile tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer/*.py
      - name: Focused persistent-map contract
        env:
          PYTHONPATH: tools/climate_analyzer
        run: pytest -q tools/climate_analyzer/tests/test_onebuilding_persistent_map_contract.py tools/climate_analyzer/tests/test_onebuilding_map_cache_contract.py
      - name: Profile marker payload and dynamic layer
        run: |
          python - <<'PY'
          import ast
          import html
          import json
          import time
          from pathlib import Path
          import pandas as pd
          import folium
          from folium.plugins import FastMarkerCluster
          from streamlit_folium import _get_feature_group_string

          app_path = Path('tools/climate_analyzer/app.py')
          source = app_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          wanted = {'_map_text', 'station_marker_payload', 'station_catalog_persistent_map_layers'}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          if {n.name for n in nodes} != wanted:
              raise SystemExit('Could not extract persistent-map functions')
          module = ast.Module(body=nodes, type_ignores=[])
          ns = {'pd': pd, 'folium': folium, 'html': html, 'FastMarkerCluster': FastMarkerCluster}
          exec(compile(module, str(app_path), 'exec'), ns)

          groups = pd.read_csv('tools/climate_analyzer/epw_climate_analyzer/data/station_groups.csv')
          t0 = time.perf_counter()
          payload = ns['station_marker_payload'](groups)
          payload_ms = (time.perf_counter() - t0) * 1000
          compact_bytes = len(json.dumps(payload, separators=(',', ':'), ensure_ascii=False).encode('utf-8'))

          legacy = []
          for _, row in groups.dropna(subset=['latitude', 'longitude']).iterrows():
              legacy.append([
                  float(row['latitude']), float(row['longitude']), str(row['station_group_id']),
                  str(row.get('name', '')), str(row.get('country', '')), str(row.get('region', '')),
                  str(row.get('dataset', '')), int(row.get('climate_count', 1)),
              ])
          legacy_bytes = len(json.dumps(legacy, separators=(',', ':'), ensure_ascii=False).encode('utf-8'))

          base_map, marker_group = ns['station_catalog_persistent_map_layers'](
              groups, marker_payload=payload, center=[20.0, 0.0], zoom=2, detail_zoom_threshold=8
          )
          t1 = time.perf_counter()
          feature_js = _get_feature_group_string(marker_group, base_map)
          feature_ms = (time.perf_counter() - t1) * 1000
          feature_bytes = len(feature_js.encode('utf-8'))
          ratio = compact_bytes / legacy_bytes
          print(json.dumps({
              'station_groups': len(groups),
              'payload_rows': len(payload),
              'payload_build_ms': round(payload_ms, 3),
              'compact_payload_bytes': compact_bytes,
              'legacy_payload_bytes': legacy_bytes,
              'payload_ratio': round(ratio, 4),
              'feature_group_js_bytes': feature_bytes,
              'feature_group_render_ms': round(feature_ms, 3),
          }, indent=2))
          assert len(payload) == len(groups)
          assert all(len(row) == 4 for row in payload)
          assert ratio < 0.60, ratio
          assert payload_ms < 750, payload_ms
          PY
      - name: Full Climate Analyzer regression suite
        env:
          PYTHONPATH: tools/climate_analyzer
        run: pytest -q tools/climate_analyzer/tests
      - name: Remove one-shot qualification infrastructure
        run: |
          rm tools/climate_analyzer/scripts/apply_climate_0_6_2_persistent_map.py
          rm .github/workflows/climate-0.6.2-persistent-map-qualify.yml
      - name: Commit qualified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CLIMATE-0.6.2: persistent compact OneBuilding station map'
          git push origin HEAD:climate-0.6.2-persistent-map-finalwork
