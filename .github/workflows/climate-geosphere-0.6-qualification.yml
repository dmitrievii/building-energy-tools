name: CLIMATE-GEOSPHERE-0.6 wind horizontal solar qualification

on:
  push:
    branches:
      - climate-geosphere-0.6-wind-horizontal-solar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.6-wind-horizontal-solar
          fetch-depth: 0

      - name: Apply production patch
        run: python tools/climate_analyzer/remediation/geosphere_0_6_wind_horizontal_solar.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
          pip install pytest

      - name: Compile source
        run: python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer

      - name: Run focused GeoSphere 0.6 regressions
        working-directory: tools/climate_analyzer
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_historical_wind_solar_capabilities.py \
            tests/test_geosphere_public_integration.py \
            tests/test_cadence_duration_metrics.py \
            tests/test_cadence_frequency_visuals.py

      - name: Run full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: PYTHONPATH=. pytest -q tests

      - name: Remove one-shot infrastructure
        run: |
          rm tools/climate_analyzer/remediation/geosphere_0_6_wind_horizontal_solar.py
          rm .github/workflows/climate-geosphere-0.6-qualification.yml

      - name: Commit qualified permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/charts.py \
                  tools/climate_analyzer/epw_climate_analyzer/historical_capabilities.py \
                  tools/climate_analyzer/tests/test_historical_wind_solar_capabilities.py \
                  tools/climate_analyzer/remediation/geosphere_0_6_wind_horizontal_solar.py \
                  .github/workflows/climate-geosphere-0.6-qualification.yml
          if git diff --cached --quiet; then
            echo "No qualified changes to commit"
            exit 1
          fi
          git commit -m "CLIMATE-GEOSPHERE-0.6: expose measured wind and horizontal solar"
          git push origin HEAD:climate-geosphere-0.6-wind-horizontal-solar
