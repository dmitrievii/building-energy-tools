name: IGE P9.1H4 source-schema-corrected final AT DE CH comparison
# Corrections: AT source IDs, CH documented hourly decade paths and UTC end-time.
# One rerun for the same frozen cohort and same untuned model; no new sites or years.
# Frozen successful result: run #39064281150 (3,024 actual station pairs).
# No push trigger or automatic reruns; publication-scale validation deferred.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed_nine_stations_original_hourly_source_benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed ERA5 ARCO geopotential and source climate dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray==2025.9.0' 'zarr>=3.1,<4' 'gcsfs>=2025.7,<2027'
      - name: Single physical comparison 2022 AT DE CH original QC station vs B0 B1 B2 H; one run, publish failures too
        run: python -u research/ige_cmip6/p9_1h4_once_real_regional_2022_benchmark.py --out outputs/p9h4
      - name: Archive only real-source aggregates and blocked-cell provenance; no raw station observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p9h4-AT-DE-CH-2022-once-original-nine-station-comparison
          path: outputs/p9h4/*.json
          retention-days: 30
          if-no-files-found: warn
