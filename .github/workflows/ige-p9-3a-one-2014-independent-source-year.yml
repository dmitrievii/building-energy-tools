name: IGE P9.3A original 2014 unchanged cohort verified canonical weather content not HTTP envelope
# Research annual physics test complete. Only explicit manual reruns.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_CanESM5_2014_hourly_ERA5_pressure_T_q:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SciPy deterministic constrained temperature and water vapor physical solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Preregistered original NASA CanESM5 original 2014 not previously scored
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ github.token }}
          name: ige-p6-CanESM5-historical-1995-2014
          path: inputs/p93a-original-gcm
      - name: Authenticate registered unchanged NASA daily original source
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          root=Path('inputs/p93a-original-gcm')
          need=['joint_daily_raw.csv','quality_report.json','source_provenance.json']
          if not all((root/x).is_file() for x in need):raise ValueError('P93A_MISSING_ORIGINAL_SOURCE_FILES')
          s=hashlib.sha256((root/'joint_daily_raw.csv').read_bytes()).hexdigest()
          registered=json.loads(Path('research/ige_cmip6/p7c3_expected_daily_source_shas.json').read_text())['source_sha256']['CanESM5_historical-1995-2014']
          if s!=registered:raise ValueError('P93A_ORIGINAL_SOURCE_SHA_MISMATCH')
          out=Path('inputs/p93a-canonical');out.mkdir(exist_ok=True,parents=True)
          with zipfile.ZipFile(out/'IGE_P7C3_SRC_CanESM5_historical-1995-2014.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.iterdir()):
                  if p.is_file():z.write(p,p.name)
          print('P93A_REGISTERED_SOURCE_VERIFIED',s,flush=True)
          PY
      - name: Execute one original-source 2014 independent-year 366-day physical census, no post hoc source replacement
        run: |
          python -u research/ige_cmip6/p9_3a_original_canesm5_2014_year_pressure_temperature_q.py \
             --original-canesm5-registered-zip inputs/p93a-canonical/IGE_P7C3_SRC_CanESM5_historical-1995-2014.zip \
             --out outputs/p93a-2014
      - name: Archive original daily status and complete research-only 2014 8760 EPW if all source constraints pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p93a-original-2014-independent-year-pressure-T-q-physical-and-optional-CET-EPW
          path: outputs/p93a-2014/
          if-no-files-found: warn
          retention-days: 20
