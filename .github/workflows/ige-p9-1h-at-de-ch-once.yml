name: IGE P9.1H regional cohort one-time offline contracts

on:
  push:
    branches: ['research/ige-p9-1h-near-surface-inversion-20261017']
    paths:
      - '.github/workflows/ige-p9-1h-at-de-ch-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three_country_2022_ERA5_DEM_regional_guard_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only AT DE CH, only Jan/Jul 2022, original SRTM, bounded physics; no external data request
        run: |
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h_regional_AT_DE_CH_guard.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_physical_inversion_candidate.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_source_era5_dem_adapter.py' -v
