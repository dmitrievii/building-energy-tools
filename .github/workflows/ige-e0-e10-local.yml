name: IGE local climate audit and automatic regression
on:
  workflow_dispatch:
  push:
    branches:
      - research/ige-e0-e10-local-20261107
    paths:
      - tools/ige_climate_experiments/**
      - .github/workflows/ige-e0-e10-local.yml
jobs:
  native-layout-and-process-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Numerical dependencies
        working-directory: tools/ige_climate_experiments
        run: python -m pip install -r requirements_regression.txt
      - name: Offline contracts and spawned workers
        working-directory: tools/ige_climate_experiments
        run: python -m unittest discover -s tests -v
      - name: Humidity conversions and all 18 synthetic candidates
        working-directory: tools/ige_climate_experiments
        run: |
          python ige_humidity.py self-check
          python tests/validate_humidity.py
