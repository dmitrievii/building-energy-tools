name: Interannual overlay app binding

on:
  push:
    branches:
      - feat/interannual-overlay
    paths:
      - '.github/workflows/interannual-overlay-app-bind.yml'

permissions:
  contents: write

jobs:
  bind-app-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/interannual-overlay
          fetch-depth: 0

      - name: Apply exact source binding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/climate_analyzer/app.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    global CHRONOLOGICAL, CALENDAR_PROFILE, display_period_labels, is_multiyear, time_basis\n',
                  '    global CHRONOLOGICAL, CALENDAR_PROFILE, INTERANNUAL_OVERLAY, display_period_labels, is_multiyear, time_basis\n',
              ),
              (
                  '        from epw_climate_analyzer.temporal_filtering import (\n            CALENDAR_PROFILE,\n            CHRONOLOGICAL,\n',
                  '        from epw_climate_analyzer.temporal_filtering import (\n            CALENDAR_PROFILE,\n            CHRONOLOGICAL,\n            INTERANNUAL_OVERLAY,\n',
              ),
              (
                  '            [CHRONOLOGICAL, CALENDAR_PROFILE],\n',
                  '            [CHRONOLOGICAL, CALENDAR_PROFILE, INTERANNUAL_OVERLAY],\n',
              ),
              (
                  '                "Chronological keeps every real period in order. Calendar profile aligns equivalent "\n'
                  '                "calendar positions across the selected years for multi-year min/mean/max or typical-period analysis."\n',
                  '                "Chronological keeps every real period in order. Calendar profile combines equivalent "\n'
                  '                "calendar positions according to the existing profile/averaging rules. Interannual overlay "\n'
                  '                "keeps every real year independent and aligns the yearly series on a common calendar axis."\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one app.py binding target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit binding and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/interannual-overlay-app-bind.yml
          git add tools/climate_analyzer/app.py
          git commit -m "Climate: bind interannual overlay into Time basis UI"
          git push origin HEAD:feat/interannual-overlay
