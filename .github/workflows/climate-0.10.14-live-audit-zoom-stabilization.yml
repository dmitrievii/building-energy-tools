name: CLIMATE-0.10.14 live zoom stabilization

on:
  push:
    branches:
      - climate-0.10.14-live-audit-zoom-stabilization
    paths:
      - '.github/workflows/climate-0.10.14-live-audit-zoom-stabilization.yml'
      - 'tools/climate_analyzer/remediation/climate_0_10_14_live_audit_zoom_stabilization.py'

permissions:
  contents: write

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://building-climate-analyzer.streamlit.app/
      AUDIT_OUTPUT_DIR: artifacts/live-audit
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: climate-0.10.14-live-audit-zoom-stabilization
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Apply zoom stabilization patch
        run: python tools/climate_analyzer/remediation/climate_0_10_14_live_audit_zoom_stabilization.py

      - name: Validate JavaScript syntax
        run: node --check deployment/live_browser_audit.mjs

      - name: Install browser-audit dependencies
        run: npm install --no-save playwright-core@1.55.0 axe-core@4.10.3

      - name: Validate patched audit against live production
        run: node deployment/live_browser_audit.mjs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-0.10.14-live-audit-evidence
          path: artifacts/live-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Run focused audit contract tests
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_live_runtime_identity_contract -v

      - name: Remove one-shot validation files
        run: |
          rm -f tools/climate_analyzer/remediation/climate_0_10_14_live_audit_zoom_stabilization.py
          rm -f .github/workflows/climate-0.10.14-live-audit-zoom-stabilization.yml

      - name: Commit live-qualified stabilization patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "fix: stabilize consecutive Leaflet zoom audit"
          git push origin HEAD:climate-0.10.14-live-audit-zoom-stabilization
