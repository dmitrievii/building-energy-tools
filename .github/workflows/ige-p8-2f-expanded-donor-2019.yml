name: IGE P8.2F 2019 expanded nearest Swiss donors pilot
on:
  push:
    branches: ['research/ige-p8-meteonorm8-batch-automation-20261012']
    paths:
      - 'research/ige_cmip6/p8_2f_expanded_2019.py'
      - 'research/ige_cmip6/test_p8_2f_expanded_2019.py'
      - '.github/workflows/ige-p8-2f-expanded-donor-2019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-expanded-2019:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - run: python -m unittest discover -s research/ige_cmip6 -p test_p8_2f_expanded_2019.py -v
      - name: Frozen Austrian station index
        run: |
          mkdir -p "$RUNNER_TEMP/ige_p8_2f_expanded/source" "$RUNNER_TEMP/ige_p8_2f_expanded/out"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_p8_2f_expanded/source/stations.json"
          python - "$RUNNER_TEMP/ige_p8_2f_expanded/source/stations.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(s)==258 and sum(a.get('periode')=='1991–2020' for a in s)==189
          PY
      - name: Probe original independent station sources and compare frozen annual model
        run: |
          python research/ige_cmip6/p8_2f_expanded_2019.py \
            --austria-station-normals "$RUNNER_TEMP/ige_p8_2f_expanded/source/stations.json" \
            --out "$RUNNER_TEMP/ige_p8_2f_expanded/out"
      - name: Preserve metadata and aggregate skill; never original hourly rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2f-expanded-donor-source-and-skill-2019
          path: |
            ${{ runner.temp }}/ige_p8_2f_expanded/out/*.csv
            ${{ runner.temp }}/ige_p8_2f_expanded/out/*.json
          if-no-files-found: warn
          retention-days: 30