name: IGE V1 precontrol availability gate preserve AT holdout
on:
  workflow_dispatch:
  push:
    branches:
      - research/ige-v1-time-admission-preregistration-20261026
    paths:
      - research/ige_cmip6/v1_control_admission.py
      - research/ige_cmip6/v1_control_admission_addendum_20261026.json
      - research/ige_cmip6/v1_results_20261026.json
      - .github/workflows/ige-v1-control-admission-20261026.yml
permissions:
  contents: read
jobs:
  precontrol_gate_and_original_QC:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: tools/climate_analyzer:research/ige_cmip6
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/climate_analyzer/requirements.txt numcodecs==0.15.1 deprecated==3.0.0 wrapt==2.5.1
      - run: python research/ige_cmip6/v1_control_admission.py --out outputs/v1-control-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IGE-V1-precontrol-AT-QC-gate
          path: outputs/v1-control-gate/
          if-no-files-found: warn
          retention-days: 30
