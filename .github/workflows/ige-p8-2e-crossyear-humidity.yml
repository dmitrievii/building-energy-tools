name: IGE P8.2E cross-year moisture extremes and EPW UTC alignment
on:
  push:
    branches:
      - research/ige-p8-meteonorm8-batch-automation-20261012
    paths:
      - research/ige_cmip6/p8_2e_crossyear.py
      - research/ige_cmip6/test_p8_2e.py
      - .github/workflows/ige-p8-2e-crossyear-humidity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epw-time-and-science-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Frozen cross-year physics, missing data, UTC interval-end & EPW calendar contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2e.py' -v
  meteo-swiss-annual-generalization:
    needs: epw-time-and-science-contracts
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Original Austrian station index provenance
        run: |
          mkdir -p "$RUNNER_TEMP/ige_p8_2e/source" "$RUNNER_TEMP/ige_p8_2e/metrics"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_p8_2e/source/stations.json"
          python - "$RUNNER_TEMP/ige_p8_2e/source/stations.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(s)==258 and sum(x.get('periode')=='1991–2020' for x in s)==189
          print('IGE P8.2E independent Austrian station source identities PASS')
          PY
      - name: Frozen external annual humidity reconstruction and RH spell verification
        run: |
          python research/ige_cmip6/p8_2e_crossyear.py \
            --austria-station-normals "$RUNNER_TEMP/ige_p8_2e/source/stations.json" \
            --year ${{ matrix.year }} --out "$RUNNER_TEMP/ige_p8_2e/metrics"
      - name: Publish ONLY derived metrics and SHA/provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2e-humidity-year-${{ matrix.year }}-research-metrics
          path: |
            ${{ runner.temp }}/ige_p8_2e/metrics/*.csv
            ${{ runner.temp }}/ige_p8_2e/metrics/*.json
          retention-days: 30
          if-no-files-found: warn