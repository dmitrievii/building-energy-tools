name: Stage5 Interannual Single Provider Patch

on:
  push:
    branches:
      - fix/interannual-overlay-single-provider-stage-5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interannual-overlay-single-provider-stage-5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply single-provider browser patch
        run: python deployment/stage5_patch_single_provider.py
      - name: Check smoke syntax
        run: node --check deployment/interannual_overlay_browser_smoke.mjs
      - name: Commit staged result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment/interannual_overlay_browser_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Test: load only temperature in interannual hourly smoke"
          git push origin HEAD:fix/interannual-overlay-single-provider-stage-5
