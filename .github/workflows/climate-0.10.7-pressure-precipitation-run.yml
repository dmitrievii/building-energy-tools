name: CLIMATE-0.10.7 Pressure and Precipitation Runner

on:
  push:
    branches:
      - climate-0.10.7-epw-pressure-precipitation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply pressure and precipitation update
        run: |
          python tools/climate_analyzer/scripts/apply_pressure_precipitation_update.py
          python tools/climate_analyzer/scripts/fix_precipitation_navigation_contract.py
      - name: Compile Python
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests
      - name: Focused pressure and precipitation regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_pressure_precipitation_contract.py' -v
      - name: Startup and wet-bulb regressions
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest discover -s tests -p 'test_startup_dependency_contract.py' -v
          python -m unittest discover -s tests -p 'test_wet_bulb_temperature_route.py' -v
      - name: Full Climate Analyzer regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit validated update
        run: |
          rm tools/climate_analyzer/scripts/apply_pressure_precipitation_update.py
          rm tools/climate_analyzer/scripts/fix_precipitation_navigation_contract.py
          rm .github/workflows/climate-0.10.7-pressure-precipitation-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CLIMATE-0.10.7: default to EPW pressure and add precipitation analysis"
          git push origin HEAD:climate-0.10.7-epw-pressure-precipitation
