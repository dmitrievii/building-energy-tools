name: Apply Climate 0.7.4.2 psychrometric runtime guard

on:
  push:
    branches:
      - hotfix/v0.7.4.2-psychrometric-stale-module-guard
    paths:
      - 'deployment/patch_v0742_psychrometric_runtime_guard.py'
      - '.github/workflows/patch-v0742-psychrometric-runtime-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.7.4.2-psychrometric-stale-module-guard
      - name: Apply guarded import patch
        run: python deployment/patch_v0742_psychrometric_runtime_guard.py
      - name: Remove temporary patch transport
        run: |
          rm deployment/patch_v0742_psychrometric_runtime_guard.py
          rm .github/workflows/patch-v0742-psychrometric-runtime-guard.yml
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: refresh stale psychrometric modules before chart binding"
          git push origin HEAD:hotfix/v0.7.4.2-psychrometric-stale-module-guard
