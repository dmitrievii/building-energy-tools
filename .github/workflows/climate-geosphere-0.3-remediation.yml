name: CLIMATE-GEOSPHERE-0.3 remediation

on:
  push:
    branches:
      - climate-geosphere-0.3-public-historical-selection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.3-public-historical-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climate_analyzer/requirements.txt
      - name: Apply patch
        run: python tools/climate_analyzer/_geosphere03_patch.py
      - name: Compile
        run: python -m compileall -q tools/climate_analyzer
      - name: GeoSphere integration tests
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_geosphere_adapter
          python -m unittest -v tests.test_geosphere_public_integration
      - name: Verify current official GeoSphere metadata contract
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from epw_climate_analyzer.geosphere import fetch_metadata, parse_stations, supported_parameter_mapping
          metadata = fetch_metadata()
          stations = parse_stations(metadata)
          mapping = supported_parameter_mapping(metadata)
          assert stations, "GeoSphere metadata returned no stations"
          assert "tl" in mapping, "GeoSphere metadata no longer exposes validated tl"
          assert mapping["tl"].canonical_name == "dry_bulb_temperature_c"
          print(f"GeoSphere live metadata: {len(stations)} stations; {len(mapping)} supported mapped parameters")
          PY
      - name: Full Climate Analyzer tests
        working-directory: tools/climate_analyzer
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Remove one-shot remediation files
        run: |
          rm tools/climate_analyzer/_geosphere03_patch.py
          rm .github/workflows/climate-geosphere-0.3-remediation.yml
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "CLIMATE-GEOSPHERE-0.3: expose measured historical station source"
            git push origin HEAD:climate-geosphere-0.3-public-historical-selection
          fi
