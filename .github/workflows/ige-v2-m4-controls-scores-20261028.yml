name: IGE V2-M4 ONCE controls and frozen AT DE CH scoring
on:
  workflow_dispatch:
  push:
    branches:
      - research/ige-v2-executable-preregistration-20261027
    paths:
      - research/ige_cmip6/v2_m4_execution.py
      - research/ige_cmip6/v2_m4_score_audit.py
      - research/ige_cmip6/v2_m4_execution_contract_20261028.json
      - tools/climate_analyzer/tests/test_ige_v2_m4.py
      - .github/workflows/ige-v2-m4-controls-scores-20261028.yml
concurrency:
  group: ige-v2-m4-once-control-acquisition
  cancel-in-progress: false
permissions:
  contents: read
env:
  PYTHONPATH: tools/climate_analyzer:research/ige_cmip6
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  sealed_controls_then_registered_scores:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - run: python -m pip install -r tools/climate_analyzer/requirements.txt numcodecs==0.15.1 deprecated==3.0.0 wrapt==2.5.1
      - name: Replay frozen predictions and test control executor before opening targets
        run: |
          python research/ige_cmip6/v2_weather_verify.py --out outputs/precontrol --source-directory research/ige_cmip6
          python -m unittest discover -s tools/climate_analyzer/tests -p test_ige_v2_m4.py -v
      - name: Publish one-time control acquisition claim after exact published prediction gate
        run: python research/ige_cmip6/v2_m4_execution.py start
      - name: Acquire only registered source-admitted control products within cumulative weather budget
        run: python research/ige_cmip6/v2_weather_io.py --phase controls --out outputs/control-originals --published-commit 45dda3789542191346dba7d8a579fdd74c560894
      - name: Verify actual control originals and cumulative budgets
        run: python research/ige_cmip6/v2_m4_execution.py prepare-controls --source outputs/control-originals --out outputs/control-artifact
      - uses: actions/upload-artifact@v4
        id: original_controls
        with:
          name: IGE-V2-M4-original-control-packet
          path: outputs/control-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Publish original controls before any score tables
        env:
          CONTROL_ARTIFACT_ID: ${{ steps.original_controls.outputs.artifact-id }}
          CONTROL_ARTIFACT_DIGEST: ${{ steps.original_controls.outputs.artifact-digest }}
        run: python research/ige_cmip6/v2_m4_execution.py publish-controls --source outputs/control-artifact
      - name: Apply frozen M2 scorer to exactly the published predictions
        run: python research/ige_cmip6/v2_weather_run.py --phase score --out outputs/scores --published-commit 45dda3789542191346dba7d8a579fdd74c560894
      - name: Replay frozen scores without network and independently audit paired arithmetic
        run: python research/ige_cmip6/v2_m4_execution.py replay --source outputs/scores --out outputs/score-replay
      - name: Prepare all-case results and original data lineage
        run: python research/ige_cmip6/v2_m4_execution.py prepare-final --source outputs/scores --replay-dir outputs/score-replay --out outputs/final-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: IGE-V2-M4-registered-scores-pairs-and-replay
          path: outputs/final-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Publish scores without changing method QC thresholds targets or dates
        run: python research/ige_cmip6/v2_m4_execution.py publish-final --source outputs/final-artifact
      - name: Retain originals and partial outputs if failure; no re-acquisition
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IGE-V2-M4-failure-retained-originals-and-journals
          path: outputs/
          if-no-files-found: warn
          retention-days: 90
