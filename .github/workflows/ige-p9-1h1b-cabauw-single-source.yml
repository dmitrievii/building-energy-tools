name: IGE P9.1H1B restricted original KNMI Cabauw source audit
# One-time original attempt 2026-10-17 was HTTP 429. No automatic retries.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manually_registered_source_readback_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'xarray>=2025.1,<2027' 'h5netcdf>=1.4,<2'
      - run: python -u research/ige_cmip6/p9_1h1b_KNMI_cabauw_original_2018.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p9h1b-manual-knmi-source-provenance
          path: outputs/p9h1b/*.json
          if-no-files-found: warn
          retention-days: 30
