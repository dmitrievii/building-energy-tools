name: CLIMATE-GEOSPHERE-0.3 rebase on current main

on:
  push:
    branches:
      - climate-geosphere-0.3-rebase-main

permissions:
  contents: write

jobs:
  inspect-conflict:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current integration branch
        uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.3-rebase-main
          fetch-depth: 0

      - name: Print app.py diff3 conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git fetch origin climate-geosphere-0.3-public-historical-selection
          git merge --no-commit --no-ff origin/climate-geosphere-0.3-public-historical-selection || true
          echo '--- STATUS ---'
          git status --short
          echo '--- APP.PY CONFLICT HUNKS ---'
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/climate_analyzer/app.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          i = 0
          found = 0
          while i < len(lines):
              if lines[i].startswith('<<<<<<<'):
                  found += 1
                  start = max(0, i - 12)
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('>>>>>>>'):
                      j += 1
                  end = min(len(lines), j + 13)
                  print(f'\n===== CONFLICT {found} lines {i+1}-{j+1} =====')
                  for n in range(start, end):
                      print(f'{n+1:05d}: {lines[n]}')
                  i = j + 1
              else:
                  i += 1
          print(f'\nTOTAL_CONFLICTS={found}')
          if found == 0:
              raise SystemExit('Expected app.py merge conflict was not found')
          PY
