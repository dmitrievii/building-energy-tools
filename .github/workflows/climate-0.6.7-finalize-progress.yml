name: Climate 0.6.7 Finalize Progress

on:
  push:
    branches:
      - feature/v0.6.7-geosphere-load-progress
    paths:
      - tools/climate_analyzer/scripts/patch_0_6_7_finalize_progress.py
      - .github/workflows/climate-0.6.7-finalize-progress.yml

permissions:
  contents: write

jobs:
  finalize-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.6.7-geosphere-load-progress
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Climate Analyzer dependencies
        run: python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply final 0.6.7 lifecycle patch
        run: python tools/climate_analyzer/scripts/patch_0_6_7_finalize_progress.py

      - name: Validate focused progress and transport contracts
        working-directory: tools/climate_analyzer
        run: |
          python -m compileall -q epw_climate_analyzer app.py
          python -m unittest tests.test_geosphere_transport_0_6_5 tests.test_geosphere_progress_0_6_7
          git diff --check

      - name: Commit finalized production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/epw_climate_analyzer/geosphere.py tools/climate_analyzer/tests/test_geosphere_progress_0_6_7.py
          if ! git diff --cached --quiet; then
            git commit -m 'Climate 0.6.7: finalize GeoSphere progress lifecycle'
            git push origin HEAD:feature/v0.6.7-geosphere-load-progress
          fi
