name: Climate Analyzer PR83 Visual Walkthrough

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'deployment/pr83_visual_walkthrough.mjs'
      - '.github/workflows/climate-analyzer-pr83-visual-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-analyzer-pr83-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools/climate_analyzer
      TARGET_URL: http://127.0.0.1:8502/
      CHROME_PATH: /usr/bin/google-chrome
      PR83_MONTHLY_FIXTURE: artifacts/pr83-visual/monthly-provider.json
      PR83_VISUAL_DIR: artifacts/pr83-visual/screenshots

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Prepare monthly provider fixture
        run: |
          mkdir -p artifacts/pr83-visual/screenshots
          python deployment/pr83_monthly_contract_probe.py
          cp artifacts/pr83-contract-smoke/monthly-provider.json "$PR83_MONTHLY_FIXTURE"

      - name: Start fresh PR branch Streamlit
        run: |
          nohup python -m streamlit run tools/climate_analyzer/app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8502 \
            > artifacts/pr83-visual/streamlit.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo 'Visual walkthrough Streamlit is healthy.'
              exit 0
            fi
            sleep 1
          done
          cat artifacts/pr83-visual/streamlit.log || true
          exit 1

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Capture visual walkthrough
        run: |
          # Keep the walkthrough in the normal user-facing Core catalogue. The
          # DataEditor helper matches any cell text, so use human-readable labels
          # instead of hidden provider IDs. Station selection reuses the proven
          # precipitation-smoke station metadata contract.
          python - <<'PY'
          from pathlib import Path

          path = Path('deployment/pr83_visual_walkthrough.mjs')
          text = path.read_text()
          text = text.replace("  await setDate(page,'From date (UTC)','2020-01-01'); await setDate(page,'Through date (UTC)','2025-12-31');\n", "")
          text = text.replace(
              "const REQUIRED_PROVIDERS = ['tl_mittel','tlmin','tlmax','rf_mittel','p','tp_mittel','tb10_mittel'];",
              "const REQUIRED_PROVIDERS = ['Air temperature — monthly mean','Air temperature — absolute monthly minimum','Air temperature — absolute monthly maximum','Relative humidity — monthly mean','Station pressure — monthly mean','Dew-point temperature — monthly mean','Ground temperature 0.10 m — monthly mean'];"
          )
          text = text.replace(
              "  await page.goto(TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000}); await chooseSource(page); await selectDataset(page,'1 month','klima-v2-1m'); await selectExactStation(page,fixture.station_name,fixture.station_id);\n  await clickTextChoice(page,'All provider parameters');",
              "  await page.goto(TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000}); await chooseSource(page); await selectDataset(page,'1 month','klima-v2-1m'); await selectExactStation(page,fixture.station_name,fixture.station_id);\n  await screenshot(page,'00-monthly-core-source.png');"
          )

          start = text.index('async function selectExactStation(')
          end = text.index('async function clickTextChoice(', start)
          replacement = r'''async function stationMetadata(frame) {
            const tables=frame.locator('[data-testid="stDataFrame"]');
            if (!(await tables.count())) return {};
            const rows=tables.first().locator('[role="grid"] tr[role="row"]');
            const result={};
            const count=await rows.count();
            for (let index=0; index<count; index+=1) {
              const cells=rows.nth(index).locator('[role="gridcell"]');
              if (await cells.count()<2) continue;
              const key=(await cells.nth(0).textContent().catch(()=>'' )).trim();
              const value=(await cells.nth(1).textContent().catch(()=>'' )).trim();
              if (key) result[key]=value;
            }
            return result;
          }
          async function selectExactStation(page,name,id) {
            let frame=await appFrame(page,'Search GeoSphere station',60000);
            const input=await labelledInput(frame,'Search GeoSphere station');
            await input.fill(String(name),{timeout:15000});
            await input.press('Tab').catch(()=>{});
            const started=performance.now();
            let observed={};
            while (performance.now()-started<60000) {
              try {
                frame=await appFrame(page,'Selected station',5000);
                frame=await appFrame(page,'Measured variables to load',5000);
                observed=await stationMetadata(frame);
                if (String(observed.ID||'')===String(id) && String(observed.Station||'').includes(name)) return frame;
              } catch {}
              await sleep(300);
            }
            throw new Error(`Station search did not settle on ${name} (ID ${id}); observed ${JSON.stringify(observed)}.`);
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          node deployment/pr83_visual_walkthrough.mjs

      - name: Reject runtime tracebacks
        if: always()
        run: |
          if grep -E 'Traceback \(most recent call last\)|Uncaught app execution' artifacts/pr83-visual/streamlit.log; then
            cat artifacts/pr83-visual/streamlit.log
            exit 1
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-pr83-visual-walkthrough
          path: artifacts/pr83-visual
          if-no-files-found: error
          retention-days: 30
