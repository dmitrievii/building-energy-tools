name: Climate Analyzer PR83 Visual Walkthrough

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'deployment/pr83_visual_walkthrough.mjs'
      - '.github/workflows/climate-analyzer-pr83-visual-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-analyzer-pr83-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools/climate_analyzer
      TARGET_URL: http://127.0.0.1:8502/
      CHROME_PATH: /usr/bin/google-chrome
      PR83_MONTHLY_FIXTURE: artifacts/pr83-visual/monthly-provider.json
      PR83_VISUAL_DIR: artifacts/pr83-visual/screenshots

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Prepare monthly provider fixture
        run: |
          mkdir -p artifacts/pr83-visual/screenshots
          python deployment/pr83_monthly_contract_probe.py
          cp artifacts/pr83-contract-smoke/monthly-provider.json "$PR83_MONTHLY_FIXTURE"

      - name: Start fresh PR branch Streamlit
        run: |
          nohup python -m streamlit run tools/climate_analyzer/app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8502 \
            > artifacts/pr83-visual/streamlit.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo 'Visual walkthrough Streamlit is healthy.'
              exit 0
            fi
            sleep 1
          done
          cat artifacts/pr83-visual/streamlit.log || true
          exit 1

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Capture visual walkthrough
        run: |
          # Visual evidence uses the normal Core catalogue first. For deterministic
          # automation only, switch to All provider parameters after that screenshot
          # so provider IDs are visible to the DataEditor row locator.
          python - <<'PY'
          from pathlib import Path

          path = Path('deployment/pr83_visual_walkthrough.mjs')
          text = path.read_text()
          text = text.replace("  await setDate(page,'From date (UTC)','2020-01-01'); await setDate(page,'Through date (UTC)','2025-12-31');\n", "")
          text = text.replace(
              "  await page.goto(TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000}); await chooseSource(page); await selectDataset(page,'1 month','klima-v2-1m'); await selectExactStation(page,fixture.station_name,fixture.station_id);\n  await clickTextChoice(page,'All provider parameters');",
              "  await page.goto(TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000}); await chooseSource(page); await selectDataset(page,'1 month','klima-v2-1m'); await selectExactStation(page,fixture.station_name,fixture.station_id);\n  await screenshot(page,'00-monthly-core-source.png');\n  await clickTextChoice(page,'All provider parameters');"
          )

          start = text.index('async function selectExactStation(')
          end = text.index('async function clickTextChoice(', start)
          replacement = r'''async function selectVisibleOption(page, frame, controlLabel, predicate, timeoutMs=60000) {
            const started=performance.now();
            while (performance.now()-started<timeoutMs) {
              frame=await appFrame(page,'Climate Analyzer',5000);
              let control;
              try { control=await combo(frame,controlLabel,5000); } catch { await sleep(250); continue; }
              try { await control.scrollIntoViewIfNeeded({timeout:3000}).catch(()=>{}); await control.click({timeout:5000}); }
              catch { await sleep(250); continue; }
              const optionStarted=performance.now();
              while (performance.now()-optionStarted<6000) {
                for (const options of [frame.getByRole('option'),page.getByRole('option'),frame.locator('[data-baseweb="menu"] li'),page.locator('[data-baseweb="menu"] li')]) {
                  const count=await options.count().catch(()=>0);
                  for (let i=0;i<count;i++) {
                    const option=options.nth(i);
                    const optionText=(await option.innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
                    if (!predicate(optionText) || !(await option.isVisible().catch(()=>false))) continue;
                    await option.click({timeout:8000});
                    return await appFrame(page,'Climate Analyzer',10000);
                  }
                }
                await sleep(200);
              }
              await page.keyboard.press('Escape').catch(()=>{}); await sleep(300);
            }
            throw new Error(`Could not select ${controlLabel}`);
          }
          async function selectExactStation(page,name,id) {
            let frame=await appFrame(page,'Search GeoSphere station',60000);
            const input=await labelledInput(frame,'Search GeoSphere station');
            await input.fill(String(name),{timeout:15000});
            await input.press('Tab').catch(()=>{});
            frame=await appFrame(page,'Manual station selection',60000);
            const targetId=String(id);
            frame=await selectVisibleOption(page,frame,'Search-result stations',(t)=>t.includes(name)&&(t.includes(`ID ${targetId}`)||t.includes(targetId)),60000);
            const started=performance.now();
            let lastControl='';
            let useClicks=0;
            while (performance.now()-started<45000) {
              frame=await appFrame(page,'Climate Analyzer',5000);
              const body=await bodyText(frame);
              if (body.includes('Selected station')&&body.includes(name)&&body.includes(targetId)) return frame;
              try {
                const stationCombo=await combo(frame,'Search-result stations',3000);
                lastControl=await rendered(stationCombo);
                const exact=lastControl.includes(name)&&(lastControl.includes(`ID ${targetId}`)||lastControl.includes(targetId));
                const use=frame.getByRole('button',{name:'Use station from list',exact:true}).first();
                const useVisible=await use.count().catch(()=>0) && await use.isVisible().catch(()=>false);
                if (exact && useVisible) {
                  await use.click({force:true,timeout:10000}).catch(()=>{});
                  useClicks+=1;
                  await sleep(900);
                  continue;
                }
                if (exact && !useVisible && body.includes('Measured variables to load')) return frame;
              } catch {}
              if (body.includes('Measured variables to load') && body.includes(name)) return frame;
              await sleep(250);
            }
            throw new Error(`Exact station ID ${targetId} did not settle; control=${lastControl}; useClicks=${useClicks}`);
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          node deployment/pr83_visual_walkthrough.mjs

      - name: Reject runtime tracebacks
        if: always()
        run: |
          if grep -E 'Traceback \(most recent call last\)|Uncaught app execution' artifacts/pr83-visual/streamlit.log; then
            cat artifacts/pr83-visual/streamlit.log
            exit 1
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-pr83-visual-walkthrough
          path: artifacts/pr83-visual
          if-no-files-found: error
          retention-days: 30
