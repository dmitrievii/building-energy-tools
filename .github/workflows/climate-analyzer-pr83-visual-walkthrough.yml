name: Climate Analyzer PR83 Visual Walkthrough

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'deployment/pr83_visual_walkthrough.mjs'
      - '.github/workflows/climate-analyzer-pr83-visual-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-analyzer-pr83-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools/climate_analyzer
      TARGET_URL: http://127.0.0.1:8502/
      CHROME_PATH: /usr/bin/google-chrome
      PR83_MONTHLY_FIXTURE: artifacts/pr83-visual/monthly-provider.json
      PR83_VISUAL_DIR: artifacts/pr83-visual/screenshots

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Prepare monthly provider fixture
        run: |
          mkdir -p artifacts/pr83-visual/screenshots
          python deployment/pr83_monthly_contract_probe.py
          cp artifacts/pr83-contract-smoke/monthly-provider.json "$PR83_MONTHLY_FIXTURE"

      - name: Start fresh PR branch Streamlit
        run: |
          nohup python -m streamlit run tools/climate_analyzer/app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8502 \
            > artifacts/pr83-visual/streamlit.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo 'Visual walkthrough Streamlit is healthy.'
              exit 0
            fi
            sleep 1
          done
          cat artifacts/pr83-visual/streamlit.log || true
          exit 1

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Capture visual walkthrough
        run: |
          # This is visual evidence, not a widget-mechanics test. Keep the native
          # complete-year dates and the default Core-variable catalogue. Confirm
          # the explicitly selected station before touching the variable editor.
          python - <<'PY'
          from pathlib import Path
          path = Path('deployment/pr83_visual_walkthrough.mjs')
          text = path.read_text()
          text = text.replace("  await clickTextChoice(page,'All provider parameters');\n", "")
          text = text.replace(
              "    try { if ((await rendered(await combo(frame,'Search-result stations',3000))).includes(name)) return frame; } catch {}",
              """    try {
                const stationCombo=await combo(frame,'Search-result stations',3000);
                if ((await rendered(stationCombo)).includes(name)) {
                  const use=frame.getByRole('button',{name:'Use station from list',exact:true}).first();
                  if (await use.count().catch(()=>0) && await use.isVisible().catch(()=>false)) {
                    await use.click({timeout:10000}); await sleep(700);
                  }
                }
              } catch {}"""
          )
          # The two date setters are on one source line; remove that visual-only line.
          text = text.replace("  await setDate(page,'From date (UTC)','2020-01-01'); await setDate(page,'Through date (UTC)','2025-12-31');\n", "")
          path.write_text(text)
          PY
          node deployment/pr83_visual_walkthrough.mjs

      - name: Reject runtime tracebacks
        if: always()
        run: |
          if grep -E 'Traceback \(most recent call last\)|Uncaught app execution' artifacts/pr83-visual/streamlit.log; then
            cat artifacts/pr83-visual/streamlit.log
            exit 1
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-pr83-visual-walkthrough
          path: artifacts/pr83-visual
          if-no-files-found: error
          retention-days: 30
