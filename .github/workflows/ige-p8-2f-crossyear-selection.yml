name: IGE P8.2F cross-year expanded Swiss donor selector
on:
  push:
    branches:
      - research/ige-p8-meteonorm8-batch-automation-20261012
    paths:
      - research/ige_cmip6/p8_2f_station_selection.py
      - research/ige_cmip6/test_p8_2f_station_selection.py
      - research/ige_cmip6/p8_2f_crossyear_expanded.py
      - .github/workflows/ige-p8-2f-crossyear-selection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor-selection-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Fixed physical closure, leap years, no-target and coverage contracts
        run: |
          python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2f_station_selection.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2f_expanded_2019.py' -v
  full-source-crossyear:
    needs: donor-selection-contracts
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Frozen Austrian station calibration source identities
        run: |
          mkdir -p "$RUNNER_TEMP/ige_p8_2f_crossyear/source" "$RUNNER_TEMP/ige_p8_2f_crossyear/out"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_p8_2f_crossyear/source/stations.json"
          python - "$RUNNER_TEMP/ige_p8_2f_crossyear/source/stations.json" <<'PY'
          import json,sys
          stations=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(stations)==258 and sum(s.get('periode')=='1991–2020' for s in stations)==189
          print('Austrian station index unchanged PASS')
          PY
      - name: Complete Swiss source availability, nearest donor selection and frozen physics
        run: |
          python research/ige_cmip6/p8_2f_crossyear_expanded.py \
            --year ${{ matrix.year }} \
            --austria-station-normals "$RUNNER_TEMP/ige_p8_2f_crossyear/source/stations.json" \
            --nearest-metadata 20 \
            --out "$RUNNER_TEMP/ige_p8_2f_crossyear/out"
      - name: Only station-level aggregate diagnostics, donor identities and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2f-crossyear-expanded-${{ matrix.year }}
          path: |
            ${{ runner.temp }}/ige_p8_2f_crossyear/out/*.csv
            ${{ runner.temp }}/ige_p8_2f_crossyear/out/*.json
          if-no-files-found: warn
          retention-days: 30