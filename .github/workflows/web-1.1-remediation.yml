name: WEB-1.1 Global Catalog and Map Remediation

on:
  push:
    branches:
      - web-1.1-global-catalog-map-viewport-fix

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: web-1.1-global-catalog-map-viewport-fix
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Build strict global Climate.OneBuilding catalog
        working-directory: tools/climate_analyzer
        run: |
          python scripts/update_station_catalog.py --regions all

      - name: Apply map viewport ownership remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/climate_analyzer/app.py')
          text = path.read_text(encoding='utf-8')

          old = '''    # Initialize map view only once. After that, always preserve the user's
    # current zoom and center, especially after clicking another station.
    default_center = [float(station_groups_all["latitude"].mean()), float(station_groups_all["longitude"].mean())]
    center = st.session_state.get("station_map_center", default_center)
    zoom = int(st.session_state.get("station_map_zoom", 2))
    bounds = st.session_state.get("station_map_bounds")

    if st.button("Reset map view to filtered stations"):
        st.session_state["station_map_center"] = default_center
        st.session_state["station_map_zoom"] = 2 if len(station_groups_all) > 25 else 6
        st.session_state.pop("station_map_bounds", None)
        st.rerun()
'''
          new = '''    # Leaflet owns viewport interaction. Pan/zoom must not be mirrored through
    # Streamlit session state because each viewport event would trigger a rerun and
    # feed the previous server-side center/zoom back into the browser. Only an
    # explicit reset remounts the map with the filtered-station default view.
    default_center = [float(station_groups_all["latitude"].mean()), float(station_groups_all["longitude"].mean())]
    default_zoom = 2 if len(station_groups_all) > 25 else 6
    map_reset_token = int(st.session_state.get("station_map_reset_token", 0))

    if st.button("Reset map view to filtered stations"):
        st.session_state["station_map_reset_token"] = map_reset_token + 1
        st.rerun()
'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one map state block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''                center=center,
                zoom=zoom,
'''
          new = '''                center=default_center,
                zoom=default_zoom,
'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one center/zoom call block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''            returned_objects=["last_object_clicked_tooltip", "center", "zoom", "bounds"],
            key="climate_onebuilding_selectable_cluster_map",
'''
          new = '''            # Do not return center/zoom/bounds: those Leaflet events must stay
            # browser-local and must not cause Streamlit reruns. A station click is
            # the only map interaction that crosses the component boundary.
            returned_objects=["last_object_clicked_tooltip"],
            key=f"climate_onebuilding_selectable_cluster_map_{map_reset_token}",
'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one st_folium return contract, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''
    update_station_map_view_state(map_state)

    clicked_group = None
'''
          new = '''
    clicked_group = None
'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one map-state update call, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''        selected_flag = 1 if group_id == str(selected_group_id) else 0
'''
          new = '''        # Keep the rendered map payload stable when the selected station changes.
        # Selection belongs to the right-hand Streamlit panel, not to Leaflet's
        # marker rendering, so a click does not force a map remount.
        selected_flag = 0
'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one selected marker flag, found {text.count(old)}')
          text = text.replace(old, new)

          text = text.replace(
              '            max_value=50000,\n            value=int(st.session_state.get("station_selectable_cluster_limit", 20000)),\n            step=1000,',
              '            max_value=100000,\n            value=int(st.session_state.get("station_selectable_cluster_limit", 50000)),\n            step=5000,',
          )
          text = text.replace(
              'if len(station_groups_for_map) > int(st.session_state.get("station_selectable_cluster_limit", 20000)):',
              'if len(station_groups_for_map) > int(st.session_state.get("station_selectable_cluster_limit", 50000)):',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add WEB-1.1 regression contract
        run: |
          cat > tools/climate_analyzer/tests/test_map_viewport_and_global_catalog_contract.py <<'PY'
          import hashlib
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          APP = (ROOT / 'app.py').read_text(encoding='utf-8')
          DATA = ROOT / 'epw_climate_analyzer' / 'data'


          def test_map_viewport_is_browser_owned():
              assert 'returned_objects=["last_object_clicked_tooltip"]' in APP
              assert 'returned_objects=["last_object_clicked_tooltip", "center", "zoom", "bounds"]' not in APP
              assert 'update_station_map_view_state(map_state)' not in APP
              assert 'key=f"climate_onebuilding_selectable_cluster_map_{map_reset_token}"' in APP
              assert 'station_map_reset_token' in APP


          def test_station_selection_does_not_mutate_map_payload():
              assert 'selected_flag = 0' in APP
              assert 'selected_flag = 1 if group_id == str(selected_group_id) else 0' not in APP


          def test_global_catalog_is_integrity_bound_and_not_bootstrap():
              manifest = json.loads((DATA / 'station_catalog.meta.json').read_text(encoding='utf-8'))
              csv_bytes = (DATA / 'station_catalog.csv').read_bytes()
              assert manifest['catalog_kind'] == 'generated_provider_snapshot'
              assert manifest['station_count'] > 20
              assert len(manifest['build_evidence']['regions']) == 7
              assert manifest['build_evidence']['failed_catalogs'] == 0
              assert hashlib.sha256(csv_bytes).hexdigest() == manifest['csv_sha256']
              coverage = manifest['coverage'].lower()
              for region in ('africa', 'asia', 'south america', 'north and central america', 'southwest pacific', 'europe', 'antarctica'):
                  assert region in coverage
          PY

      - name: Validate generated catalog and regression suite
        working-directory: tools/climate_analyzer
        run: |
          python -m compileall -q app.py epw_climate_analyzer scripts tests
          python - <<'PY'
          from epw_climate_analyzer.catalog_runtime import load_production_station_catalog, load_station_catalog_manifest
          catalog = load_production_station_catalog()
          manifest = load_station_catalog_manifest()
          assert len(catalog) == manifest.station_count
          assert manifest.catalog_kind == 'generated_provider_snapshot'
          assert manifest.build_evidence['failed_catalogs'] == 0
          print(f'Global catalog validation PASS: {manifest.catalog_version}; {len(catalog):,} climate records')
          PY
          python -m pytest -q

      - name: Commit validated remediation
        run: |
          rm .github/workflows/web-1.1-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.csv \
                  tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.meta.json \
                  tools/climate_analyzer/tests/test_map_viewport_and_global_catalog_contract.py \
                  .github/workflows/web-1.1-remediation.yml
          git commit -m "WEB-1.1: fix map viewport and promote global climate catalog [web-1.1-generated]"
          git push origin HEAD:web-1.1-global-catalog-map-viewport-fix
