name: IGE P9.3B1 streaming full original CanESM5 ps source catalog original identity
# Archived source-recovery audit. Repeat only by explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_ps_immutable_catalog_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check strict original CMIP identity contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_3b1_canesm5_ps_discovery.py' -v
      - name: Probe one original Pangeo CMIP6 ESGF mirror catalog, exact CanESM5 ps day historical r1i1p1f1 gn
        run: python -u research/ige_cmip6/p9_3b1_canesm5_ps_discovery.py --out outputs/p93b1
      - name: Archive exact source provenance and catalog SHA, not pressure measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p93b1-original-canesm5-ps-day-source-catalog-frozen
          path: outputs/p93b1/*.json
          if-no-files-found: warn
          retention-days: 30
