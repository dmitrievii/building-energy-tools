name: CLIMATE-0.10.6 Wet-bulb Hotfix Runner

on:
  push:
    branches:
      - climate-0.10.6-wet-bulb-temperature-hotfix

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply wet-bulb temperature hotfix
        run: python tools/climate_analyzer/scripts/apply_wet_bulb_temperature_hotfix.py

      - name: Compile Python
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests

      - name: Focused wet-bulb regression
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_wet_bulb_temperature_route.py' -v

      - name: Startup dependency regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_startup_dependency_contract.py' -v

      - name: Full Climate Analyzer regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated hotfix
        run: |
          rm tools/climate_analyzer/scripts/apply_wet_bulb_temperature_hotfix.py
          rm .github/workflows/climate-0.10.6-wet-bulb-hotfix-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CLIMATE-0.10.6: fix wet-bulb temperature derivation route"
          git push origin HEAD:climate-0.10.6-wet-bulb-temperature-hotfix
