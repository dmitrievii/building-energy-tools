name: IGE P8.2E frozen temperature bias in observed humid hours
on:
  push:
    branches:
      - research/ige-p8-meteonorm8-batch-automation-20261012
    paths:
      - research/ige_cmip6/p8_2e_temperature_bias_audit.py
      - research/ige_cmip6/test_p8_2e_temperature_bias_audit.py
      - .github/workflows/ige-p8-2e-temperature-bias.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Frozen diagnostic conditioning and UTC semantics contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2e_temperature_bias_audit.py' -v
  swiss-annual-conditional-temperature-bias:
    needs: scientific-contracts
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Validate historical Austrian calibration index
        run: |
          mkdir -p "$RUNNER_TEMP/ige_bias/source" "$RUNNER_TEMP/ige_bias/output"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_bias/source/stations.json"
          python - "$RUNNER_TEMP/ige_bias/source/stations.json" <<'PY'
          import json,sys
          stations=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(stations)==258 and sum(s.get('periode')=='1991–2020' for s in stations)==189
          print('Original Austria station index frozen PASS')
          PY
      - name: Evaluate model minus observed T on independent Swiss station hours
        run: |
          python research/ige_cmip6/p8_2e_temperature_bias_audit.py \
             --year ${{ matrix.year }} \
             --austria-station-normals "$RUNNER_TEMP/ige_bias/source/stations.json" \
             --out "$RUNNER_TEMP/ige_bias/output"
      - name: Archive aggregate bias and provenance only, no provider hourly series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2e-conditional-temperature-bias-${{ matrix.year }}
          path: |
            ${{ runner.temp }}/ige_bias/output/temperature_bias_*.csv
            ${{ runner.temp }}/ige_bias/output/temperature_bias_provenance.json
          if-no-files-found: warn
          retention-days: 30