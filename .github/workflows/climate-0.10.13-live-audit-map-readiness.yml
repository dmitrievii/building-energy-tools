name: CLIMATE-0.10.13 live audit map readiness

on:
  push:
    branches:
      - climate-0.10.13-live-audit-map-readiness
    paths:
      - '.github/workflows/climate-0.10.13-live-audit-map-readiness.yml'
      - 'tools/climate_analyzer/remediation/climate_0_10_13_live_audit_map_readiness.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: climate-0.10.13-live-audit-map-readiness
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Apply live-audit readiness patch
        run: python tools/climate_analyzer/remediation/climate_0_10_13_live_audit_map_readiness.py

      - name: Validate JavaScript syntax
        run: node --check deployment/live_browser_audit.mjs

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Run focused audit contract tests
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_live_runtime_identity_contract -v

      - name: Remove one-shot remediation files
        run: |
          rm -f tools/climate_analyzer/remediation/climate_0_10_13_live_audit_map_readiness.py
          rm -f .github/workflows/climate-0.10.13-live-audit-map-readiness.yml

      - name: Commit qualified audit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "fix: make live map audit lazy-render aware"
          git push origin HEAD:climate-0.10.13-live-audit-map-readiness
