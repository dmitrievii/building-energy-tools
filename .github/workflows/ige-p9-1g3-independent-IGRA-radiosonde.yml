name: IGE P9.1G3 truly independent NOAA IGRA original radiosonde vs 2019 ERA5 pressure stability

on:
  push:
    branches: ['research/ige-p9-1g-era5-vertical-stability-dwd-20261017']
    paths:
      - 'research/ige_cmip6/p9_1g3_independent_IGRA_era5_925_850.py'
      - 'research/ige_cmip6/test_p9_1g3_independent_original_IGRA_pressure_contracts.py'
      - '.github/workflows/ige-p9-1g3-independent-IGRA-radiosonde.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_IGRA2_sounding_fixed_width_QC_925_850_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: IGRA2 original reported T925 T850 QC deleted; GPH above ground; Kelvin potential temperature and NOAA provenance
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1g3_independent_original_IGRA_pressure_contracts.py' -v

  original_NOAA_German_radiosonde_and_actual_ARCO_ERA5_pressure_vertical_validation:
    needs: original_IGRA2_sounding_fixed_width_QC_925_850_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray==2025.9.0' 'zarr>=3.1,<4' 'gcsfs>=2025.7,<2027'
      - name: True IGRA Lindenberg observed 2019 925/850hPa original air column pressure temperatures vs ARCO ERA5 vertical field
        run: |
          python -u research/ige_cmip6/p9_1g3_independent_IGRA_era5_925_850.py --out outputs/p9g3
      - name: Validate origin of actual IGRA reported sondes and ERA5 observational sign/gradient skill
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          folder=Path('outputs/p9g3')
          a=json.loads((folder/'p9_1g3_independent_original_IGRA_vs_ERA5_pressure_skill.json').read_text())
          b=json.loads((folder/'p9_1g3_original_IGRA_sounding_source_only.json').read_text())
          assert a['n_predeclared_2019_00_12UTC_slots']==28
          assert a['n_paired_true_original_IGRA_and_ARCO_soundings']>=14
          assert b['n_independent_original_soundings_complete']>=14
          assert all(math.isfinite(a[n]) for n in [
            'MAE_ERA5_925hPa_T_against_IGRA_C',
            'MAE_ERA5_850hPa_T_against_IGRA_C',
            'MAE_ERA5_vs_IGRA_T_gradient_K_km',
            'MAE_ERA5_vs_IGRA_theta_gradient_K_km'])
          assert a['independent_IGRA_did_not_fit_ERA5_pressure_or_site_temperature'] is True
          assert a['radiosonde_nominal_UTC_vs_actual_launch_and_level_time_not_harmonized'] is True
          assert a['this_is_free_air_vertical_skill_not_surface_cold_air_pool_validation'] is True
          assert a['production_epw_ready'] is False
          print('IGE P9.1G3 observed independent IGRA free-atmosphere profile gradients vs ERA5 PASS; site cold-air pool NOT proven')
          PY
      - name: Archive source SHA and science aggregates; never original IGRA individual sounding or full source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p9-1g3-original-NOAA-IGRA-2019-Lindenberg-ERA5-pressure-level-validation
          path: outputs/p9g3/*.json
          if-no-files-found: warn
          retention-days: 30
