name: IGE P9.1H23 first physical candidate historical contract replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exploratory_frozen_original_model_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_physical_inversion_candidate.py' -v
