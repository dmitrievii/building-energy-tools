name: IGE P9.1H23 single physical-candidate contract check

on:
  push:
    branches: ['research/ige-p9-1h-near-surface-inversion-20261017']
    paths:
      - '.github/workflows/ige-p9-1h23-one-time-physics-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physically_constrained_candidate_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: UTC solar geometry, bounded cooling, terrain and missing-source fallback; zero external API calls
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_physical_inversion_candidate.py' -v
