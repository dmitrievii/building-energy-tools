name: IGE P9.1H23 physical inversion contract checks (manual, offline)

# Limited-scope policy: earlier one-shot original tests passed.
# Further execution only when source/model code changes and explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h23_source_aligned_existing_dem_era5_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Solar physics, source uncertainty, bounded cooling and original DEM adapter; offline only
        run: |
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_physical_inversion_candidate.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_1h23_source_era5_dem_adapter.py' -v
