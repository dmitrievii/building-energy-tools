name: Climate 0.7 Precipitation Snow Patch

on:
  push:
    branches:
      - feature/v0.7-precipitation-snow
    paths:
      - tools/climate_analyzer/scripts/patch_0_7_precipitation_snow.py
      - .github/workflows/climate-0.7-precipitation-snow-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.7-precipitation-snow
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Climate Analyzer dependencies
        run: python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply 0.7 patch
        run: python tools/climate_analyzer/scripts/patch_0_7_precipitation_snow.py

      - name: Validate focused 0.7 block
        working-directory: tools/climate_analyzer
        run: |
          python -m compileall -q epw_climate_analyzer app.py
          python -m unittest tests.test_precipitation_snow_0_7 tests.test_geosphere_transport_0_6_5 tests.test_native_diagnostics_contract_0_6_5
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/epw_climate_analyzer/climate_model.py tools/climate_analyzer/epw_climate_analyzer/geosphere.py tools/climate_analyzer/app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Climate 0.7: add dual-resolution precipitation and snow analytics'
            git push origin HEAD:feature/v0.7-precipitation-snow
          fi
