name: TEMP Climate 0.6.5 Native Quality Patch

on:
  push:
    branches:
      - feature/v0.6.5-canonical-hourly-analysis
    paths:
      - 'tools/climate_analyzer/scripts/apply_065_native_quality_patch.py'
      - '.github/workflows/climate-065-native-quality-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.6.5-canonical-hourly-analysis
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/climate_analyzer/scripts/apply_065_native_quality_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git diff --cached --quiet && exit 0
          git commit -m "Climate 0.6.5: rewire native Data Quality and hourly provenance"
          git push origin HEAD:feature/v0.6.5-canonical-hourly-analysis
