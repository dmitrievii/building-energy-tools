name: IGE P9.2B one-time physical source-cause diagnostic contracts
on:
  push:
    branches: ['research/ige-p9-2-joint-hourly-regimes-20261017']
    paths:
      - '.github/workflows/ige-p9-2b-once-final-cause-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_exact_rejection_semantics_no_physics_change:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P9.2B 16 physics contracts with separate saturation and solar source rejection codes
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2b_cmip6_daily_joint_regimes.py' -v
      - name: P9.2A unchanged source hourly joint vector contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2a_joint_weather_regimes.py' -v
