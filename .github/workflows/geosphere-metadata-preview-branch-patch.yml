name: GeoSphere metadata preview branch patch

on:
  push:
    branches:
      - feature/v0.6.3-geosphere-metadata-preview-cache

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.3-geosphere-metadata-preview-cache
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install Climate Analyzer dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply deterministic metadata preview patch
        run: python tools/climate_analyzer/scripts/apply_geosphere_metadata_preview_063.py
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/geosphere.py \
            tools/climate_analyzer/tests/test_geosphere_metadata_preview_cache_0_6_3.py
      - name: Run focused metadata preview regressions
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest tests.test_geosphere_metadata_preview_cache_0_6_3 -v
          python -m unittest tests.test_geosphere_adapter -v
          python -m unittest tests.test_geosphere_0_6_2_precip_map_variables -v
          python -m unittest tests.test_geosphere_public_integration -v
      - name: Commit branch implementation
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/geosphere.py \
                  tools/climate_analyzer/tests/test_geosphere_metadata_preview_cache_0_6_3.py
          git commit -m 'CLIMATE 0.6.3: add GeoSphere metadata preview and cache'
          git push origin HEAD:feature/v0.6.3-geosphere-metadata-preview-cache
