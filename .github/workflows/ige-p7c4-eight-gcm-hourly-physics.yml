name: IGE P7C.4 source-gated hourly physical-closure contracts (public fixture)
on:
  push:
    branches:
      - research/ige-p7c4-eight-gcm-hourly-epw-20261012
    paths:
      - research/ige_cmip6/p7c4_hourly_ensemble.py
      - research/ige_cmip6/test_p7c4_hourly_ensemble.py
      - research/ige_cmip6/p7c3_expected_daily_source_shas.json
      - .github/workflows/ige-p7c4-eight-gcm-hourly-physics.yml
      - docs/IGE_P7C4_EIGHT_GCM_HOURLY_PHYSICAL_CLOSURE_RU.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-registered-8gcm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Synthetic unit and fail-closed original-source tests
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p7c4_hourly_ensemble.py' -v && python -m unittest discover -s research/ige_cmip6 -p 'test_p7c3_ensemble.py' -v
      - name: Download original ACCESS historical and future P6 research archives
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          pattern: ige-p6-access-*
          path: inputs/access
      - name: Download seven original P6 research models and windows
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ github.token }}
          pattern: ige-p6-*
          path: inputs/seven_original
      - name: Download declared repaired P6 archives for source corrections
        uses: actions/download-artifact@v4
        with:
          run-id: 38077903914
          github-token: ${{ github.token }}
          pattern: ige-p6-*
          path: inputs/repair
      - name: Construct deterministic archive containers without modifying daily CSVs
        run: |
          python - <<'PY'
          import sys,hashlib,json,zipfile
          from pathlib import Path
          sys.path.insert(0,'research/ige_cmip6')
          from p7c3_ensemble import MODELS, HIST, WINDOWS
          out=Path('inputs/canonical');out.mkdir(parents=True,exist_ok=True)
          expected=json.loads(Path('research/ige_cmip6/p7c3_expected_daily_source_shas.json').read_text())['source_sha256']
          for model in MODELS:
            for window in (HIST,)+WINDOWS:
              suffix=('access' if model=='ACCESS-CM2' else model)+'-'+window
              folders=[Path('inputs')/r/('ige-p6-'+suffix) for r in ('repair','seven_original','access')]
              matches=[x for x in folders if x.is_dir()]
              if not matches:raise ValueError('Missing original artifact '+model+' '+window)
              selected=matches[0]
              key=model+'_'+window
              raw=(selected/'joint_daily_raw.csv').read_bytes()
              if hashlib.sha256(raw).hexdigest()!=expected[key]:
                raise ValueError('Expected original daily immutable SHA differs: '+key)
              name='IGE_P7C3_SRC_'+key+'.zip'
              with zipfile.ZipFile(out/name,'w',compression=zipfile.ZIP_DEFLATED) as z:
                for p in sorted(selected.iterdir()):
                  if p.is_file():
                    info=zipfile.ZipInfo(p.name,date_time=(1980,1,1,0,0,0))
                    info.compress_type=zipfile.ZIP_DEFLATED
                    z.writestr(info,p.read_bytes())
              print('selected',key,'source',selected,flush=True)
          assert len(list(out.glob('*.zip')))==40
          print('P7C3 original 40 model-windows and pinned daily source SHA PASS')
          PY
      - name: Cross-check all 40 original GCM daily SHA and 384 monthly climate signals
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'research/ige_cmip6')
          from p7c4_hourly_ensemble import verify_daily_sources,MODELS,WINDOWS,can_morph_moisture,build_signal
          sources,monthly=verify_daily_sources('inputs/canonical',
            'research/ige_cmip6/p7c3_expected_daily_source_shas.json',
            'research/ige_cmip6/results/p7c3_384_monthly_model_signals.csv')
          assert len(sources)==40 and len(monthly)==384
          passed=0;blocked=0
          for model in MODELS:
            for window in WINDOWS:
              if not can_morph_moisture(sources,model,window):
                assert model=='IPSL-CM6A-LR';blocked+=1;continue
              signals=build_signal(model,window,sources,monthly)
              assert len(signals)==12
              passed+=1
          assert passed==28 and blocked==4
          print('P7C.4 original 40 source SHA, 384 monthly changes, 28 eligible, 4 IPSL blocked — PASS')
          PY
      - name: Download prior public synthetic baseline research EPW for separate smoke
        uses: actions/download-artifact@v4
        with:
          run-id: 38171672579
          name: ige-p7b4-integrated-2013-canesm5-m2-research-epw
          github-token: ${{ github.token }}
          path: inputs/p7b4_public_fixture
      - name: One-model integrated hourly physics smoke on public synthetic baseline ONLY
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'research/ige_cmip6')
          import p7c1_epw_morphing as m
          from p7c1b_humidity_closure import hourly_redistribution
          from p7c1c_hourly_humidity_coherence import arrays_for_moisture,minimize_humidity,evaluate_epw
          from p7c4_hourly_ensemble import verify_daily_sources,build_signal,verify_hourly,climate_ratio
          root=Path('inputs/p7b4_public_fixture')
          f=root/'Graz_CanESM5_2013_IGE_P7B4_M2_SOLAR_INTEGRATED_RESEARCH_ONLY.epw'
          assert m.sha(f)=='2e45abbcba52c49e51e3811676ba37167bc8700f697e13032ee103ff8f3f7012'
          head,old,meta=m.read_epw(f)
          source,reg=verify_daily_sources('inputs/canonical',
            'research/ige_cmip6/p7c3_expected_daily_source_shas.json',
            'research/ige_cmip6/results/p7c3_384_monthly_model_signals.csv')
          model='CanESM5';win='ssp245-2040-2059'
          sig=build_signal(model,win,source,reg)
          _,a,_,_=m.morph_epw(head,old,sig,win.split('-')[0],win,meta)
          b,_,_,_=hourly_redistribution(old,a,climate_ratio(sig))
          month,t,p,ref,target,lo,hi,prior=arrays_for_moisture(old,b,climate_ratio(sig))
          q,opt=minimize_humidity(target,lo,hi,month,t,p,ref,prior)
          c,_=evaluate_epw(old,b,q,target,month,t,p,ref)
          info,months=verify_hourly(old,a,b,c,sig,meta,model,win)
          assert info['introduced_RH_gt20_pp_h_stage_c']==0 and len(months)==12
          assert not info['production_epw_ready']
          Path('outputs').mkdir(exist_ok=True)
          Path('outputs/p7c4_public_synthetic_one_model_smoke.json').write_text(json.dumps({
            'stage':'IGE_P7C4_PUBLIC_SYNTHETIC_ONE_MEMBER_SMOKE','synthetic_baseline_only':True,
            'production_epw_ready':False,'original_meteonorm_epw_executed_in_CI':False,
            'model':model,'window':win,'numerical':info,'optimizer':opt,
            'note':'Full local 28-Meteonorm-EPW research ensemble is separately source-authenticated; never conflate with this public fixture.'
            },indent=2)+'\n')
          print('P7C.4 PUBLIC SYNTHETIC ONE-GCM HOURLY SMOKE PASS; proprietary Meteonorm baseline NOT IN GITHUB')
          PY
      - name: Publish public-fixture-only diagnostics; never upload commercial EPWs
        uses: actions/upload-artifact@v4
        with:
          name: ige-p7c4-public-synthetic-physical-closure-smoke
          path: outputs/p7c4_public_synthetic_one_model_smoke.json