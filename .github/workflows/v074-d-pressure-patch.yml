name: Climate 0.7.4 D pressure patch

on:
  push:
    branches:
      - fix/v0.7.4-temporal-ux-psychrometric-remediation
    paths:
      - 'tools/climate_analyzer/scripts/apply_v074_d_pressure.py'
      - '.github/workflows/v074-d-pressure-patch.yml'

permissions:
  contents: write

jobs:
  apply-d-pressure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4-temporal-ux-psychrometric-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pressure remediation
        working-directory: tools/climate_analyzer
        run: |
          python scripts/apply_v074_d_pressure.py
          python -m compileall -q app.py epw_climate_analyzer tests
      - name: Commit patched source and remove transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/climate_analyzer/scripts/apply_v074_d_pressure.py .github/workflows/v074-d-pressure-patch.yml
          git add -A
          git commit -m 'fix: make shared psychrometric comparison pressure-safe'
          git push origin HEAD:fix/v0.7.4-temporal-ux-psychrometric-remediation
