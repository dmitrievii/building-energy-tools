name: IGE CD3 IV1 final snapshot read-only recheck
on:
  workflow_dispatch:
  push:
    branches:
      - research/ige-p9-3b3-cd3-iv1-audit-20261024
    paths:
      - .github/workflows/ige-p9-3b3-cd3-iv1-recheck-20261024.yml
      - research/ige_cmip6/audit_p9_3b3_CD3_IV1_20261024.py
      - research/ige_cmip6/p9_3b3_iv1_start_contract_addendum_20261024.json
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  final_snapshot_contracts_and_read_only_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numcodecs==0.16.3 pyshtools==4.13.1 eccodes==2.50.0 eccodeslib==2.50.0.33
      - name: All final snapshot B3, IV1, earlier math and pressure contracts
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for pattern in ['test_p9_3b3_*.py', 'test_p9_3a*.py', 'test_p9_2*.py', 'test_p9_3b2*.py']:
              suite.addTests(loader.discover('research/ige_cmip6', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.testsRun == 422
          raise SystemExit(not result.wasSuccessful())
          PY
          python research/ige_cmip6/p9_3b2d_canonical_pressure_fields.py
      - name: Fresh derivatives, pairwise envelopes and raw dated WMDR
        run: |
          mkdir -p outputs/recheck
          python research/ige_cmip6/audit_p9_3b3_CD3_IV1_20261024.py --out outputs/recheck/audit.json
      - name: Qualification levels and explicit start contract
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          s = json.loads(Path('outputs/recheck/audit.json').read_text())
          a = json.loads(Path('research/ige_cmip6/p9_3b3_iv1_start_contract_addendum_20261024.json').read_text())
          assert a['frozen_start_module_sha256'] == hashlib.sha256(Path('research/ige_cmip6/p9_3b3_cd3_stability.py').read_bytes()).hexdigest()
          assert s['numerical_status'] == 'PASS'
          assert s['counts']['validated_endpoints'] == 792 and s['counts']['FD_columns'] == 72864
          lines = ['422 contracts PASS; 792 unchanged endpoint states; 72864 derivative columns.',
              'No optimizer calls and no new station observations.',
              'Start wording ambiguity retained explicitly: actual alpha=0.9*min(1,r_slope).',
              'Independent station accuracy and production remain NOT QUALIFIED.',
              json.dumps(s, ensure_ascii=False)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ige-CD3-IV1-422-contracts-read-only-recheck-NOT-accuracy
          path: outputs/recheck/
          if-no-files-found: warn
          retention-days: 30
