name: v0.7.4-A temporal self-patch

on:
  push:
    branches:
      - fix/v0.7.4-temporal-ux-psychrometric-remediation
    paths:
      - .github/workflows/v074a-temporal-selfpatch.yml
      - tools/climate_analyzer/scripts/apply_v074a_temporal_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4-temporal-ux-psychrometric-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply temporal semantics remediation
        run: python tools/climate_analyzer/scripts/apply_v074a_temporal_patch.py
      - name: Self-clean patch transport
        run: |
          rm -f tools/climate_analyzer/scripts/apply_v074a_temporal_patch.py
          rm -f .github/workflows/v074a-temporal-selfpatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(climate): v0.7.4-A temporal semantics remediation"
          git push
