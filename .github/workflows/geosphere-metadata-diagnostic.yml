name: GeoSphere metadata diagnostic

on:
  push:
    branches:
      - feature/v0.6.3-geosphere-metadata-preview-cache

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect current metadata shape
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = 'https://dataset.api.hub.geosphere.at/v1/station/historical/klima-v2-10min/metadata'
          req = urllib.request.Request(url, headers={'User-Agent': 'Building-Energy-Tools-metadata-diagnostic/1'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          print('TOP_KEYS', sorted(data.keys()))
          stations = data.get('stations')
          print('STATIONS_TYPE', type(stations).__name__)
          if isinstance(stations, list):
              print('STATION_COUNT', len(stations))
              first = stations[0] if stations else {}
          elif isinstance(stations, dict):
              print('STATIONS_KEYS', sorted(stations.keys()))
              features = stations.get('features') or []
              print('STATION_COUNT', len(features))
              first = features[0] if features else {}
          else:
              first = {}
          print('FIRST_STATION', json.dumps(first, ensure_ascii=False, sort_keys=True)[:12000])
          params = data.get('parameters') or []
          print('PARAMETER_COUNT', len(params) if isinstance(params, list) else 'not-list')
          if isinstance(params, list) and params:
              print('FIRST_PARAMETER', json.dumps(params[0], ensure_ascii=False, sort_keys=True))
          for key in ('start_time','end_time','resource_id','title','frequency','mode','type'):
              if key in data:
                  print('META', key, repr(data[key]))
          PY
