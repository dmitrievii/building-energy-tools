name: Climate Analyzer GeoSphere Precipitation Snow Live Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deployment/r219_navigation.mjs'
      - 'tools/climate_analyzer/epw_climate_analyzer/sidebar_layout.py'
      - 'deployment/geosphere_precip_snow_provider_probe.py'
      - 'deployment/geosphere_precip_snow_live_smoke.mjs'
      - 'deployment/pr83_precip_snow_live_smoke.mjs'
      - '.github/workflows/climate-analyzer-geosphere-precip-snow-live-smoke.yml'
      - 'tools/climate_analyzer/CLIMATE_CORE_0_7_1.md'
      - 'tools/climate_analyzer/tests/test_geosphere_precip_snow_live_smoke_0_7_1.py'
  push:
    branches:
      - main
    paths:
      - 'tools/climate_analyzer/**'
      - 'deployment/r219_navigation.mjs'
      - 'deployment/geosphere_precip_snow_provider_probe.py'
      - 'deployment/geosphere_precip_snow_live_smoke.mjs'
      - 'deployment/pr83_precip_snow_live_smoke.mjs'
      - '.github/workflows/climate-analyzer-geosphere-precip-snow-live-smoke.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: climate-analyzer-geosphere-precip-snow-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-backed-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8501/' || 'https://building-climate-analyzer.streamlit.app/' }}
      R219_ALLOW_LEGACY_NAV: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      AUDIT_OUTPUT_DIR: artifacts/geosphere-precip-snow-smoke
      GEOSPHERE_SMOKE_FIXTURE: artifacts/geosphere-precip-snow-smoke/provider-fixture.json
      CHROME_PATH: /usr/bin/google-chrome
      PYTHONPATH: tools/climate_analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Probe live GeoSphere rr rrm sh fixture
        run: |
          python deployment/geosphere_precip_snow_provider_probe.py \
            --output "$GEOSPHERE_SMOKE_FIXTURE" \
            --timeout 60

      - name: Start exact PR candidate Streamlit
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$AUDIT_OUTPUT_DIR"
          nohup python -m streamlit run tools/climate_analyzer/app.py \
            --server.headless true --server.address 127.0.0.1 --server.port 8501 \
            > "$AUDIT_OUTPUT_DIR/candidate-streamlit.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent "$TARGET_URL"_stcore/health >/dev/null; then
              echo 'Candidate Streamlit is healthy.'
              exit 0
            fi
            sleep 1
          done
          cat "$AUDIT_OUTPUT_DIR/candidate-streamlit.log" || true
          exit 1

      - name: Show Chrome version
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Install browser smoke dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Exercise provider-backed precipitation and snow route
        run: node deployment/pr83_precip_snow_live_smoke.mjs

      - name: Reject candidate runtime errors
        if: always() && github.event_name == 'pull_request'
        run: |
          if grep -E 'Traceback \(most recent call last\)|Uncaught app execution' "$AUDIT_OUTPUT_DIR/candidate-streamlit.log"; then
            cat "$AUDIT_OUTPUT_DIR/candidate-streamlit.log"
            exit 1
          fi

      - name: Upload provider-backed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-geosphere-precip-snow-live-smoke
          path: artifacts/geosphere-precip-snow-smoke
          if-no-files-found: warn
          retention-days: 14
