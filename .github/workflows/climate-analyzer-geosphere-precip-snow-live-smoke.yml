name: Climate Analyzer GeoSphere Precipitation Snow Live Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deployment/geosphere_precip_snow_provider_probe.py'
      - 'deployment/geosphere_precip_snow_live_smoke.mjs'
      - '.github/workflows/climate-analyzer-geosphere-precip-snow-live-smoke.yml'
      - 'tools/climate_analyzer/CLIMATE_CORE_0_7_1.md'
      - 'tools/climate_analyzer/tests/test_geosphere_precip_snow_live_smoke_0_7_1.py'
  push:
    branches:
      - main
    paths:
      - 'tools/climate_analyzer/**'
      - 'deployment/geosphere_precip_snow_provider_probe.py'
      - 'deployment/geosphere_precip_snow_live_smoke.mjs'
      - '.github/workflows/climate-analyzer-geosphere-precip-snow-live-smoke.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: climate-analyzer-geosphere-precip-snow-live-smoke
  cancel-in-progress: true

jobs:
  provider-backed-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://building-climate-analyzer.streamlit.app/
      AUDIT_OUTPUT_DIR: artifacts/geosphere-precip-snow-smoke
      GEOSPHERE_SMOKE_FIXTURE: artifacts/geosphere-precip-snow-smoke/provider-fixture.json
      CHROME_PATH: /usr/bin/google-chrome
      PYTHONPATH: tools/climate_analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install Climate Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Probe live GeoSphere rr rrm sh fixture
        run: |
          python deployment/geosphere_precip_snow_provider_probe.py \
            --output "$GEOSPHERE_SMOKE_FIXTURE" \
            --timeout 60

      - name: Show Chrome version
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Install browser smoke dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Exercise live precipitation and snow route
        run: node deployment/geosphere_precip_snow_live_smoke.mjs

      - name: Upload provider-backed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-analyzer-geosphere-precip-snow-live-smoke
          path: artifacts/geosphere-precip-snow-smoke
          if-no-files-found: warn
          retention-days: 14
