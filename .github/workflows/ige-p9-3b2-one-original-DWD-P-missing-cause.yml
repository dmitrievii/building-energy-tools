name: IGE P9.3B2 corrected isolated DWD original pressure missingness audit
# P9.3B2 original source and frozen 2024 station observations completed.
# No automatic reruns or outcome-driven expansion; manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  german_original_station_absolute_P_not_sealevel_P0_source_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original DWD ZIP and exact 2024 registered hour P/QC8/P0 presence without changing model or evaluating substituted P0
        run: python -u research/ige_cmip6/p9_3b2_dwd_P_vs_P0_source_missingness_cause.py --out outputs/p93b2-DE
      - name: Archive source original absolute pressure missingness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p93b2-original-DWD-Oberstdorf-2024-station-P-versus-P0-missingness
          path: outputs/p93b2-DE/*.json
          if-no-files-found: warn
          retention-days: 30
