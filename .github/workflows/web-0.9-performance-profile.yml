name: WEB-0.9 Runtime Performance Profile

on:
  push:
    branches:
      - web-0.9-runtime-performance
    paths:
      - '.github/workflows/web-0.9-performance-profile.yml'
      - 'deployment/runtime_performance_probe.py'
      - 'tools/climate_analyzer/**'
      - '.streamlit/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PERF_OUTPUT_DIR: artifacts/performance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install application dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run runtime performance probe
        run: python deployment/runtime_performance_probe.py

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-0.9-runtime-performance
          path: artifacts/performance
          if-no-files-found: warn
          retention-days: 14
