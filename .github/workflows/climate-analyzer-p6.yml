name: Climate Analyzer P6 Dashboard and Report Qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/climate_analyzer/epw_climate_analyzer/p6_*.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/p66_*.py'
      - 'tools/climate_analyzer/tests/test_p66_atlas.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/atlas_*.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/p3_comfort.py'
      - 'tools/climate_analyzer/tests/test_atlas_profiling.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/byte_cache.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/memory_lifecycle.py'
      - 'tools/climate_analyzer/tests/test_byte_cache.py'
      - 'tools/climate_analyzer/tests/test_p67_render.py'
      - 'tools/climate_analyzer/epw_climate_analyzer/aggregations.py'
      - 'tools/climate_analyzer/tests/test_temporal_filtering_0_6_3.py'
      - 'tools/climate_analyzer/tests/test_calendar_heatmap_axes.py'
      - 'tools/climate_analyzer/tests/test_p6_dashboard_report.py'
      - 'tools/climate_analyzer/requirements.txt'
      - '.github/workflows/climate-analyzer-p6.yml'
permissions:
  contents: read
jobs:
  p6:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/climate_analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py epw_climate_analyzer
      - run: python -m unittest discover -s tests -p test_p6_dashboard_report.py -v
      - run: python -m unittest discover -s tests -p test_memory_lifecycle.py -v
      - run: python -m unittest discover -s tests -p test_byte_cache.py -v
      - run: python -m unittest discover -s tests -p test_canonical_hourly_cache_0_6_5.py -v
      - run: python -m unittest discover -s tests -p test_peak_memory.py -v
      - run: python -m unittest discover -s tests -p test_atlas_profiling.py -v
      - run: python -m unittest discover -s tests -p test_p66_atlas.py -v
      - run: python -m unittest discover -s tests -p test_p67_render.py -v
      - run: python -m unittest discover -s tests -p test_calendar_heatmap_axes.py -v
      - run: python -m unittest discover -s tests -p test_temporal_filtering_0_6_3.py -v
