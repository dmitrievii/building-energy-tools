name: IGE Streamlit Cloud research-beta candidate
on:
  push:
    branches: [release/ige-cloud-research-beta-20261028]
  pull_request:
    paths:
      - deployment/verify_ige_cloud_candidate.py
      - deployment/ige-cloud-candidate-20261028.json
      - deployment/ige-workspace-candidate-20261030.json
      - tools/climate_analyzer/**
      - research/ige_cmip6/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud_entrypoint_dependencies_and_four_products:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/climate_analyzer/requirements.txt
      - run: python deployment/verify_ige_cloud_candidate.py --contract deployment/ige-workspace-candidate-20261030.json --out outputs/cloud-preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IGE-Cloud-research-beta-annual-products-and-F1
          path: outputs/cloud-preflight/
          if-no-files-found: warn
          retention-days: 90
