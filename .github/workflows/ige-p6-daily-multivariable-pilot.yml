name: IGE P6.1 nine-variable daily CMIP6 pilot
on:
  push:
    branches:
      - research/ige-p6-joint-daily-20261010
    paths:
      - research/ige_cmip6/p6_daily_multivariable.py
      - research/ige_cmip6/test_p6_daily_multivariable.py
      - .github/workflows/ige-p6-daily-multivariable-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nasa-joint-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NASA NCSS client requirements
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'netCDF4>=1.6,<2'
      - name: Run offline science contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p6_daily_multivariable.py' -v
      - name: NASA NEX-GDDP-CMIP6 18 live annual subsets
        run: python research/ige_cmip6/p6_daily_multivariable.py --workers 4
      - name: Preserve source hashes, QA and joint daily CSV even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-joint-daily-access-cm2-pilot
          path: outputs/p6_daily_access_cm2_2014_2050/
          if-no-files-found: warn
          retention-days: 14
