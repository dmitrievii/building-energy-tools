name: Climate 0.7.4 C3 patch transport

on:
  push:
    branches:
      - fix/v0.7.4-temporal-ux-psychrometric-remediation
    paths:
      - 'tools/climate_analyzer/scripts/apply_v074_c3.py'
      - '.github/workflows/v074-c3-patch.yml'

permissions:
  contents: write

jobs:
  apply-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4-temporal-ux-psychrometric-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply C3 patch
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import base64
          import zlib

          wrapper_path = Path('scripts/apply_v074_c3.py')
          wrapper = wrapper_path.read_text(encoding='utf-8')
          tree = ast.parse(wrapper)
          payload = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'PAYLOAD' for target in node.targets):
                  payload = ast.literal_eval(node.value)
                  break
          if payload is None:
              raise RuntimeError('C3 transport payload was not found.')

          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          helper_start = source.index('def replace_once(')
          helper_end = source.index('\nreplace_once(', helper_start)
          resilient_helper = '''def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) == 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return

              old_lines = old.splitlines()
              new_lines = new.splitlines()
              first_index = next((i for i, line in enumerate(old_lines) if line.strip()), None)
              if first_index is not None:
                  first = old_lines[first_index]
                  token = first.lstrip()
                  base_indent = len(first) - len(token)
                  for actual_line in text.splitlines():
                      if actual_line.lstrip() != token:
                          continue
                      actual_indent = len(actual_line) - len(actual_line.lstrip())
                      delta = actual_indent - base_indent
                      if delta < 0:
                          continue
                      pad = " " * delta
                      shifted_old = "\\n".join((pad + line if line else line) for line in old_lines)
                      shifted_new = "\\n".join((pad + line if line else line) for line in new_lines)
                      if text.count(shifted_old) == 1:
                          path.write_text(text.replace(shifted_old, shifted_new, 1), encoding="utf-8")
                          return

              raise RuntimeError(f"{path}: expected one anchor after indentation normalization: {old[:120]!r}")
'''
          source = source[:helper_start] + resilient_helper + source[helper_end:]
          exec(compile(source, 'apply_v074_c3_payload', 'exec'))
          PY
          python -m compileall -q app.py epw_climate_analyzer tests
      - name: Commit patched source and remove transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/climate_analyzer/scripts/apply_v074_c3.py .github/workflows/v074-c3-patch.yml
          git add -A
          git commit -m 'feat: close 0.7.4-C3 source-neutral UX cleanup'
          git push origin HEAD:fix/v0.7.4-temporal-ux-psychrometric-remediation
