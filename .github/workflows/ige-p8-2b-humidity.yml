name: IGE P8.2B external humidity and hourly psychrometric closure
on:
  push:
    branches:
      - 'research/ige-p8-meteonorm8-batch-automation-20261012'
    paths:
      - 'research/ige_cmip6/p8_2b_*.py'
      - 'research/ige_cmip6/test_p8_2b.py'
      - '.github/workflows/ige-p8-2b-humidity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-physics-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow
      - name: Strict no-leakage and psychrometric regressions
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2b.py' -v
  meteoswiss-cross-country-holdout:
    needs: independent-physics-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow
      - name: Retrieve original independent Austrian station index
        run: |
          mkdir -p "$RUNNER_TEMP/ige_p8_2b_swiss/metrics"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_p8_2b_swiss/normals.json"
          python - "$RUNNER_TEMP/ige_p8_2b_swiss/normals.json" <<'PY'
          import json,sys
          st=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(st)==258 and sum(s['periode']=='1991–2020' for s in st)==189
          print('Austria index provenance gate PASS')
          PY
      - name: Frozen Austrian log-vapour lapse and Swiss genuine measured e/RH station/region holdouts
        run: |
          python research/ige_cmip6/p8_2b_humidity.py \
            --austria-station-normals "$RUNNER_TEMP/ige_p8_2b_swiss/normals.json" \
            --out "$RUNNER_TEMP/ige_p8_2b_swiss/metrics" --max-sites 36
      - name: Upload derived country holdout metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2b-swiss-monthly-measured-humidity
          path: |
            ${{ runner.temp }}/ige_p8_2b_swiss/metrics/external_*.csv
            ${{ runner.temp }}/ige_p8_2b_swiss/metrics/*provenance.json
            ${{ runner.temp }}/ige_p8_2b_swiss/metrics/swiss_stac_probe.json
          if-no-files-found: warn
          retention-days: 30
  meteoswiss-hourly-psychrometric-closure:
    needs: independent-physics-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow
      - name: Independent hourly Swiss T RH e Td P psychrometric physical closure
        run: |
          mkdir -p "$RUNNER_TEMP/ige_p8_2b_hourly/metrics"
          python research/ige_cmip6/p8_2b_hourly.py \
            --out "$RUNNER_TEMP/ige_p8_2b_hourly/metrics"
      - name: Upload measured hourly closure aggregates and source checksums only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2b-swiss-hourly-psychrometric-closure
          path: |
            ${{ runner.temp }}/ige_p8_2b_hourly/metrics/*.json
            ${{ runner.temp }}/ige_p8_2b_hourly/metrics/*.csv
          if-no-files-found: warn
          retention-days: 30