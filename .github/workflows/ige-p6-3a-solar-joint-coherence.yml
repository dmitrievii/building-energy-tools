name: IGE P6.3A eight-GCM 40-source daily multivariate solar coherence
on:
  push:
    branches:
      - research/ige-p6-3a-solar-joint-coherence-20261011
    paths:
      - .github/workflows/ige-p6-3a-solar-joint-coherence.yml
      - research/ige_cmip6/p6_3a_solar_joint_coherence.py
      - research/ige_cmip6/test_p6_3a_solar_joint_coherence.py
      - docs/IGE_P6_3A_SOLAR_JOINT_COHERENCE_PROTOCOL.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  eight-model-original-joint-coherence:
    name: P6.3A climate dependence structure after M1 M2 M3, 8 GCM × 5 windows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P6.3A test source provenance, daily-to-monthly energy conservation and dependence flags
        run: |
          python -m unittest discover -s research/ige_cmip6 -p 'test_p6_3a_solar_joint_coherence.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p6_2d_c_sensitivity_future.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p6_2d_b_daily_clearsky.py' -v
          python -m unittest discover -s research/ige_cmip6 -p 'test_p6_2d_solar_methods_benchmark.py' -v
      - name: Official fully QC approved GeoSphere station Graz GHI 1995-2014
        uses: actions/download-artifact@v4
        with:
          run-id: 38084157993
          github-token: ${{ github.token }}
          name: ige-p6-2b-graz-1995-2014-verified-solar-eight-gcm-closeout
          path: inputs/station
      - name: Unmodified NASA ACCESS-CM2 historical
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          name: ige-p6-access-historical-1995-2014
          path: inputs/access_hist/ige-p6-access-historical-1995-2014
      - name: Unmodified NASA ACCESS-CM2 future four SSP periods
        uses: actions/download-artifact@v4
        with:
          run-id: 38067931031
          github-token: ${{ github.token }}
          pattern: ige-p6-access-ssp*-20*-20*
          path: inputs/access_future
          merge-multiple: false
      - name: Unmodified seven GCM historical original sources
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ github.token }}
          pattern: ige-p6-*-historical-1995-2014
          path: inputs/seven_original_hist
          merge-multiple: false
      - name: Unmodified seven GCM future original sources
        uses: actions/download-artifact@v4
        with:
          run-id: 38072042977
          github-token: ${{ github.token }}
          pattern: ige-p6-*-ssp*-20*-20*
          path: inputs/seven_original_future
          merge-multiple: false
      - name: Historical original three-GCM verified repairs
        uses: actions/download-artifact@v4
        with:
          run-id: 38077903914
          github-token: ${{ github.token }}
          pattern: ige-p6-*-historical-1995-2014
          path: inputs/seven_repaired_hist
          merge-multiple: false
      - name: Future original four dataset verified repairs
        uses: actions/download-artifact@v4
        with:
          run-id: 38077903914
          github-token: ${{ github.token }}
          pattern: ige-p6-*-ssp*-20*-20*
          path: inputs/seven_repaired_future
          merge-multiple: false
      - name: Evaluate source-verified multivariate dependence and original radiative bounds
        run: |
          python research/ige_cmip6/p6_3a_solar_joint_coherence.py \
            --station-csv inputs/station/station30_1995_2014_daily_solar_qc.csv \
            --access-historical inputs/access_hist \
            --original-historical inputs/seven_original_hist \
            --repaired-historical inputs/seven_repaired_hist \
            --access-future inputs/access_future \
            --original-future inputs/seven_original_future \
            --repaired-future inputs/seven_repaired_future \
            --out outputs/p6_3a_original_joint_coherence
      - name: Retain 40-source multivariate physics diagnostics and SHA evidence even on flagged scientific review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p6-3a-eight-gcm-40-source-joint-physical-dependence-audit
          path: outputs/p6_3a_original_joint_coherence/
          retention-days: 30
          if-no-files-found: warn
