name: IGE P8.2F independent donor station suitability and original four vs alternatives
on:
  push:
    branches: ['research/ige-p8-meteonorm8-batch-automation-20261012']
    paths:
      - 'research/ige_cmip6/p8_2f_donor_audit.py'
      - 'research/ige_cmip6/test_p8_2f_donor_audit.py'
      - '.github/workflows/ige-p8-2f-donor-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - run: python -m unittest discover -s research/ige_cmip6 -p test_p8_2f_donor_audit.py -v
  donor-comparison:
    needs: scientific-contracts
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - name: Fetch frozen original Austrian station norms
        run: |
          mkdir -p "$RUNNER_TEMP/p8_2f/source" "$RUNNER_TEMP/p8_2f/metrics"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/p8_2f/source/stations.json"
          python - "$RUNNER_TEMP/p8_2f/source/stations.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(s)==258 and sum(a.get('periode')=='1991–2020' for a in s)==189
          PY
      - name: Reproduce baseline and independent donor alternatives
        run: |
          python research/ige_cmip6/p8_2f_donor_audit.py \
            --year ${{ matrix.year }} \
            --austria-station-normals "$RUNNER_TEMP/p8_2f/source/stations.json" \
            --out "$RUNNER_TEMP/p8_2f/metrics"
      - name: Export aggregate scientific metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2f-donor-audit-${{ matrix.year }}-aggregates
          path: |
            ${{ runner.temp }}/p8_2f/metrics/*.csv
            ${{ runner.temp }}/p8_2f/metrics/*.json
          if-no-files-found: warn
          retention-days: 30