name: Climate Analyzer Live HTTP Smoke

on:
  push:
    branches:
      - web-0.8.1-live-deployment-audit
    paths:
      - '.github/workflows/climate-analyzer-live-http-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET: https://building-climate-analyzer.streamlit.app
    steps:
      - name: Bootstrap public session and probe health
        shell: bash
        run: |
          set -euo pipefail

          echo '--- PUBLIC SESSION BOOTSTRAP ---'
          root_metrics=$(curl --silent --show-error --location --max-redirs 12 --max-time 30 \
            --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
            --output /tmp/root.html --dump-header /tmp/root.headers \
            --write-out 'http_code=%{http_code}\ntime_total=%{time_total}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\nredirects=%{num_redirects}\nremote_ip=%{remote_ip}\n' \
            "$TARGET/")
          printf '%s\n' "$root_metrics"
          root_code=$(printf '%s\n' "$root_metrics" | awk -F= '$1=="http_code" {print $2}')
          root_url=$(printf '%s\n' "$root_metrics" | awk -F= '$1=="url_effective" {print substr($0, index($0,"=")+1)}')
          echo "cookie_names=$(awk '!/^#/ && NF>=7 {print $6}' /tmp/cookies.txt | sort -u | paste -sd, -)"
          test "$root_code" = "200"
          test "$root_url" = "$TARGET/"

          echo '--- SESSION-AWARE HEALTH ---'
          health_metrics=$(curl --silent --show-error --location --max-redirs 5 --max-time 30 \
            --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
            --output /tmp/health.txt --dump-header /tmp/health.headers \
            --write-out 'http_code=%{http_code}\ntime_total=%{time_total}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\nredirects=%{num_redirects}\nremote_ip=%{remote_ip}\n' \
            "$TARGET/_stcore/health")
          printf '%s\n' "$health_metrics"
          health_code=$(printf '%s\n' "$health_metrics" | awk -F= '$1=="http_code" {print $2}')
          printf 'health_body='; cat /tmp/health.txt; echo
          test "$health_code" = "200"
          grep -qi 'ok' /tmp/health.txt

          echo 'LIVE_HTTP_SMOKE=PASS'
