name: WEB-0.6 Apply Public UX Patch

on:
  push:
    branches:
      - web-0.6-public-ux
    paths:
      - '.github/workflows/web06-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: web-0.6-public-ux
          fetch-depth: 0

      - name: Apply UX patch
        run: |
          set -euo pipefail
          git apply --check .web06.patch
          git apply .web06.patch
          python -m compileall -q tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer/ui_contract.py

      - name: Remove one-time files
        run: |
          rm .web06.patch
          rm .github/workflows/web06-apply.yml

      - name: Commit patched UX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WEB-0.6: implement product-first public interface'
          git push origin HEAD:web-0.6-public-ux
