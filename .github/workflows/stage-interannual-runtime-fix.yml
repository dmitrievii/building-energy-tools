name: Stage interannual runtime and browser fix

on:
  push:
    branches: [fix/interannual-overlay-smoke-runtime-stage-2]
    paths:
      - '.github/workflows/stage-interannual-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interannual-overlay-smoke-runtime-stage-2
          fetch-depth: 0
      - name: Apply exact fixes
        run: python deployment/stage_interannual_runtime_fix.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/climate_analyzer/epw_climate_analyzer/source_parity_ui.py
          node --check deployment/interannual_overlay_browser_smoke.mjs
          git diff --check
      - name: Commit staged fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/epw_climate_analyzer/source_parity_ui.py deployment/interannual_overlay_browser_smoke.mjs
          git commit -m 'Climate: fix overview pandas compatibility and overlay selector'
          git push origin HEAD:fix/interannual-overlay-smoke-runtime-stage-2
