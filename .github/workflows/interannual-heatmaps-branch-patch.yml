name: Interannual heatmaps branch patch

on:
  push:
    branches:
      - feature/v0.6.4-interannual-heatmaps

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.4-interannual-heatmaps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt
      - name: Install Climate Analyzer dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply ISO week-year boundary fix
        run: python tools/climate_analyzer/scripts/fix_interannual_heatmap_iso_week_year_064.py
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/aggregations.py \
            tools/climate_analyzer/epw_climate_analyzer/charts.py \
            tools/climate_analyzer/epw_climate_analyzer/temporal_filtering.py \
            tools/climate_analyzer/tests/test_interannual_heatmaps_0_6_4.py
      - name: Run focused 0.6.4 regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_interannual_heatmaps_0_6_4 -v
      - name: Run full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/epw_climate_analyzer/aggregations.py \
                  tools/climate_analyzer/tests/test_interannual_heatmaps_0_6_4.py
          git commit -m 'CLIMATE 0.6.4: align interannual heatmaps with ISO week-year'
          git push origin HEAD:feature/v0.6.4-interannual-heatmaps
