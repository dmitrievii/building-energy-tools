name: TEMP Climate 0.7.3 Sky Ground Patch

on:
  push:
    branches:
      - feature/v0.7.3-geosphere-parity-closure
    paths:
      - '.github/workflows/temp-climate-073-sky-ground-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.3-geosphere-parity-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and validate patch
        run: |
          cat deployment/.temp_patch_073_*.b64 | base64 -d | gunzip > deployment/patch_073_sky_ground.py
          python -m py_compile deployment/patch_073_sky_ground.py
      - name: Apply patch
        run: python deployment/patch_073_sky_ground.py
      - name: Commit target changes and self-clean
        run: |
          rm -f deployment/patch_073_sky_ground.py
          rm -f deployment/.temp_patch_073_*.b64
          rm -f .github/workflows/temp-climate-073-sky-ground-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Climate 0.7.3: close daylight and ground-temperature gaps"
          git push origin HEAD:feature/v0.7.3-geosphere-parity-closure
