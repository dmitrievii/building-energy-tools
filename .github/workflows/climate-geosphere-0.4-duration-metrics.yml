name: CLIMATE-GEOSPHERE-0.4 cadence duration metrics

on:
  push:
    branches:
      - climate-geosphere-0.4-cadence-duration-metrics

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: climate-geosphere-0.4-cadence-duration-metrics
          fetch-depth: 0

      - name: Apply cadence-duration patch
        run: python tools/climate_analyzer/remediation/climate_geosphere_0_4_duration_metrics.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Compile source
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests

      - name: Run cadence and GeoSphere focused regression
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest tests.test_cadence_duration_metrics -v
          python -m unittest tests.test_geosphere_public_integration -v
          python -m unittest tests.test_geosphere_adapter -v
          python -m unittest tests.test_degree_metrics_controls -v
          python -m unittest tests.test_climate_0_10_12_memory_hotfix -v
          python -m unittest tests.test_live_runtime_identity_contract -v

      - name: Run full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Remove one-shot files and generated caches
        run: |
          rm -f .github/workflows/climate-geosphere-0.4-duration-metrics.yml
          rm -f tools/climate_analyzer/remediation/climate_geosphere_0_4_duration_metrics.py
          rm -rf node_modules artifacts .pytest_cache
          find tools/climate_analyzer -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools/climate_analyzer -type f -name '*.pyc' -delete

      - name: Commit qualified stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "CLIMATE-GEOSPHERE-0.4: make occurrence hours cadence-aware"
          git fetch origin main
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files.txt
          printf '%s\n' \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/aggregations.py \
            tools/climate_analyzer/tests/test_cadence_duration_metrics.py \
            tools/climate_analyzer/tests/test_geosphere_public_integration.py \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          echo 'Net diff gate PASS: exactly four expected files.'
          git push origin HEAD:climate-geosphere-0.4-cadence-duration-metrics
