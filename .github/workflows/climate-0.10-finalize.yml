name: CLIMATE-0.10 Finalize

on:
  push:
    branches:
      - climate-0.10-global-catalog-stable-map

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.10-global-catalog-stable-map
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply final map/catalog remediation
        run: python .github/remediation/climate_0_10_finalize.py

      - name: Rebuild reviewed global catalog
        working-directory: tools/climate_analyzer
        run: python scripts/update_station_catalog.py --regions all

      - name: Validate global catalog profile
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          data = Path('epw_climate_analyzer/data')
          manifest = json.loads((data / 'station_catalog.meta.json').read_text(encoding='utf-8'))
          catalog = pd.read_csv(data / 'station_catalog.csv')
          evidence = manifest['build_evidence']

          assert len(catalog) == manifest['station_count']
          assert manifest['catalog_kind'] == 'generated_provider_snapshot'
          assert len(evidence['regions']) == 7
          assert evidence['failed_catalogs'] == 0
          assert evidence.get('source_file_failures', 0) == evidence.get('recovered_source_file_failures', 0)

          countries = sorted({str(v).strip() for v in catalog['country'].dropna() if str(v).strip()})
          assert len(countries) <= 300, f'Country normalization still invalid: {len(countries)} distinct values'
          for bad in ('AB_Alberta', 'TX_Texas', 'NSW_New_South_Wales'):
              assert bad not in countries, f'Subdivision leaked into country field: {bad}'

          work = catalog[['country', 'name', 'latitude', 'longitude']].copy()
          work['latitude'] = pd.to_numeric(work['latitude'], errors='coerce').round(4)
          work['longitude'] = pd.to_numeric(work['longitude'], errors='coerce').round(4)
          groups = work.dropna(subset=['latitude', 'longitude']).drop_duplicates()
          assert len(groups) <= 50000, f'Global map capacity insufficient for {len(groups)} groups'

          print(f"CATALOG_ROWS={len(catalog)}")
          print(f"PHYSICAL_STATION_GROUPS={len(groups)}")
          print(f"COUNTRY_VALUES={len(countries)}")
          print(f"LOGICAL_CATALOG_FAILURES={evidence['failed_catalogs']}")
          print(f"SOURCE_FILE_FAILURES={evidence.get('source_file_failures', 0)}")
          print(f"RECOVERED_SOURCE_FILE_FAILURES={evidence.get('recovered_source_file_failures', 0)}")
          print(f"CATALOG_SHA256={manifest['csv_sha256']}")
          PY

      - name: Compile and run full regression suite
        working-directory: tools/climate_analyzer
        run: |
          python -m compileall -q app.py epw_climate_analyzer tests scripts
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Final module import smoke
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          import epw_climate_analyzer.catalog_runtime
          import epw_climate_analyzer.climate_sources
          import epw_climate_analyzer.epw_parser
          import epw_climate_analyzer.psychrometrics
          import epw_climate_analyzer.solar
          print('Module import smoke PASS')
          PY

      - name: Commit validated production candidate
        run: |
          git rm .github/workflows/climate-0.10-finalize.yml
          git rm .github/workflows/climate-0.10-profile.yml
          git rm .github/remediation/climate_0_10_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git add tools/climate_analyzer/epw_climate_analyzer/climate_sources.py
          git add tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.csv
          git add tools/climate_analyzer/epw_climate_analyzer/data/station_catalog.meta.json
          git add tools/climate_analyzer/tests/test_global_catalog_map_contract.py
          git commit -m "CLIMATE-0.10: close global catalog and stable map remediation"
          git push origin HEAD:climate-0.10-global-catalog-stable-map
