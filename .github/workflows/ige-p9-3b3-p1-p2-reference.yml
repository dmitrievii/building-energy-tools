name: IGE P9.3B3 P1 P2 vertical reference foundation SOURCE ONLY
on:
  workflow_dispatch:
  push:
    branches:
      - research/ige-p9-3b3-p1-p2-reference-20261022
    paths:
      - research/ige_cmip6/p9_3b3_reference_protocol.json
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  mathematical_and_source_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numcodecs==0.16.3
      - name: Independent pressure oracles, bounded source readers, unchanged B3 C2 contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p9_3b3_*.py' -v
      - name: Earlier mathematics and DWD absolute versus reduced pressure
        run: |
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_3a*.py' -q
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_2*.py' -q
          python -m unittest discover -s research/ige_cmip6 -p 'test_p9_3b2*.py' -q
          python research/ige_cmip6/p9_3b2d_canonical_pressure_fields.py
      - name: Forty nine immutable scientific controls
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'research/ige_cmip6')
          from p9_3b3_reference_run import PROTOCOL,protected_controls
          result=protected_controls(json.loads(PROTOCOL.read_text()))
          print('Protected files:',result['verified_count'],'changed:',result['changed_count'])
          PY
  bounded_regional_source_probe:
    needs: mathematical_and_source_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numcodecs==0.16.3
      - name: Two source hours, three countries, no station observations or accuracy scores
        run: >-
          python -u research/ige_cmip6/p9_3b3_reference_run.py
          --probe-profiles --private-cache inputs/private-reference-cache-DO-NOT-UPLOAD
          --out outputs/P1-P2-source-only
      - name: Explicit source and qualification statuses, independent of job success
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('outputs/P1-P2-source-only/reference_probe.json').read_text())
          lines=['P1/P2 source-only probe; job success is not scientific qualification.',
                 'Complete source hours: '+str(r['cost']['complete_source_hours'])+' / 2',
                 'Historical station sensor coordinates qualified: 0 / 3',
                 'P2 source reference: '+r['P2_source_reference_qualification'],
                 'Independent accuracy: '+r['independent_accuracy'],
                 'Operational readiness: '+r['operational_readiness']]
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ige-P93B3-P1-P2-bounded-source-geometry-NOT-station-validation
          path: outputs/P1-P2-source-only/
          if-no-files-found: warn
          retention-days: 30
