name: IGE P8.2F SwissMetNet full metadata donor candidate census
on:
  push:
    branches: ['research/ige-p8-meteonorm8-batch-automation-20261012']
    paths:
      - 'research/ige_cmip6/p8_2f_station_inventory.py'
      - 'research/ige_cmip6/test_p8_2f_station_inventory.py'
      - '.github/workflows/ige-p8-2f-station-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - run: python -m unittest discover -s research/ige_cmip6 -p test_p8_2f_station_inventory.py -v
      - run: python research/ige_cmip6/p8_2f_station_inventory.py --out "$RUNNER_TEMP/ige_p8_2f_inventory"
      - uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2f-swiss-station-inventory-metadata-only
          path: |
            ${{ runner.temp }}/ige_p8_2f_inventory/*.csv
            ${{ runner.temp }}/ige_p8_2f_inventory/*.json
          if-no-files-found: error
          retention-days: 30