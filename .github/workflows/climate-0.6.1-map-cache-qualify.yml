name: CLIMATE-0.6.1 OneBuilding map cache qualification

on:
  push:
    branches:
      - climate-0.6.1-onebuilding-map-cache
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.6.1-onebuilding-map-cache
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install production dependencies
        run: python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Apply performance patch
        run: python .github/remediation/climate_0_6_1_onebuilding_map_cache.py

      - name: Build immutable physical-station snapshot
        working-directory: tools/climate_analyzer
        run: python scripts/build_station_group_snapshot.py

      - name: Compile
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts

      - name: Focused map-cache tests
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest tests.test_global_catalog_map_contract -v
          python -m unittest tests.test_onebuilding_map_cache_contract -v

      - name: Profile optimized warm map path
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          import json
          import runpy
          import time

          from epw_climate_analyzer.catalog_runtime import load_production_station_catalog, load_station_catalog_manifest
          from epw_climate_analyzer.station_group_snapshot import load_station_group_snapshot

          ns = runpy.run_path('app.py', run_name='optimized_map_profile')
          ns['_ensure_map_dependencies']()
          manifest = load_station_catalog_manifest()

          t0 = time.perf_counter()
          catalog = load_production_station_catalog()
          t1 = time.perf_counter()
          groups = load_station_group_snapshot(manifest.catalog_version, manifest.csv_sha256)
          t2 = time.perf_counter()
          key = f"{manifest.catalog_version}:{manifest.csv_sha256}|q=|c=|d=|limit=50000|rows={len(groups)}"
          fmap1 = ns['_cached_station_map_resource'](key, 8, groups)
          t3 = time.perf_counter()
          fmap2 = ns['_cached_station_map_resource'](key, 8, groups)
          t4 = time.perf_counter()
          html = fmap2.get_root().render()
          t5 = time.perf_counter()

          result = {
              'catalog_rows': len(catalog),
              'station_groups': len(groups),
              'catalog_load_s': round(t1-t0, 4),
              'snapshot_load_s': round(t2-t1, 4),
              'map_first_s': round(t3-t2, 4),
              'map_cached_s': round(t4-t3, 4),
              'html_render_s': round(t5-t4, 4),
              'html_bytes': len(html.encode('utf-8')),
          }
          print('OPTIMIZED_MAP_PROFILE=' + json.dumps(result, sort_keys=True))
          assert len(groups) > 20_000
          assert result['snapshot_load_s'] < 2.0, result
          assert result['map_cached_s'] < 0.25, result
          PY

      - name: Full Climate Analyzer regression suite
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Remove one-shot qualification infrastructure
        run: |
          git rm .github/workflows/climate-0.6.1-map-cache-qualify.yml
          git rm .github/remediation/climate_0_6_1_onebuilding_map_cache.py

      - name: Commit qualified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py
          git add tools/climate_analyzer/epw_climate_analyzer/station_group_snapshot.py
          git add tools/climate_analyzer/epw_climate_analyzer/data/station_groups.csv
          git add tools/climate_analyzer/epw_climate_analyzer/data/station_groups.meta.json
          git add tools/climate_analyzer/scripts/build_station_group_snapshot.py
          git add tools/climate_analyzer/tests/test_onebuilding_map_cache_contract.py
          git add -u .github
          git commit -m "CLIMATE-0.6.1: cache immutable OneBuilding station map"
          git push origin HEAD:climate-0.6.1-onebuilding-map-cache
