name: IGE P9.3B2D original DWD padded P CSV retraction audit for prior Potsdam Oberstdorf
# Verified source-examination and preregistered 2021 original P pilot frozen.
# Only manual reruns; do not auto-repeat station sampling.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  DWD_absolute_P_source_2023_2024_reaudit_not_new_independent_pressure_skill:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct original DWD absolute P P0 column whitespace and count old frozen 2023 2024 source data without ERA5 fit
        run: python -u research/ige_cmip6/p9_3b2d_reaudit_prior_DWD_absolute_P_source.py --out outputs/p93b2d-prior-source-correction
      - name: Archive transparent scientific erratum source SHA and no-new-holdout classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p93b2d-retrospective-DWD-P-source-padded-columns-correction
          path: outputs/p93b2d-prior-source-correction/*.json
          retention-days: 30
          if-no-files-found: warn
