name: CLIMATE-0.10.2 Compare Catalog Cache Remediation

on:
  push:
    branches:
      - climate-0.10.2-compare-catalog-cache

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: climate-0.10.2-compare-catalog-cache
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        working-directory: tools/climate_analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply remediation
        run: python .github/remediation/climate_0_10_2_compare_cache.py

      - name: Compile and run regression suite
        working-directory: tools/climate_analyzer
        run: |
          python -m compileall -q app.py epw_climate_analyzer tests scripts
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Focused compare cache contract
        run: |
          python -c "import ast; from pathlib import Path; app=Path('tools/climate_analyzer/app.py').read_text(encoding='utf-8'); tree=ast.parse(app); calls=[n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id=='cached_station_catalog']; assert len(calls)>=2; assert all(not n.args and not n.keywords for n in calls); assert 'def _cached_station_catalog_by_identity(catalog_version: str, catalog_sha256: str)' in app; print(f'CLIMATE-0.10.2 focused contract PASS: {len(calls)} zero-argument public call-sites')"

      - name: Commit validated remediation
        run: |
          git rm .github/workflows/climate-0.10.2-compare-cache-remediate.yml
          git rm .github/remediation/climate_0_10_2_compare_cache.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/climate_analyzer/app.py tools/climate_analyzer/tests/test_global_catalog_map_contract.py
          git commit -m "CLIMATE-0.10.2: make catalog cache API call-site safe"
          git push origin HEAD:climate-0.10.2-compare-catalog-cache
