name: IGE NASA CMIP6 seven independent solar models
on:
  push:
    branches: [research/ige-nex-gddp-rsds-20261010]
    paths:
      - research/ige_cmip6/nasa_rsds_extra_models.py
      - .github/workflows/ige-nasa-rsds-7-models.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rsds-model:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [MRI-ESM2-0, MPI-ESM1-2-HR, CanESM5, GFDL-ESM4, IPSL-CM6A-LR, NorESM2-MM, EC-Earth3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific NetCDF reading packages
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Download and process 100 real annual NASA NetCDF subsets
        run: python research/ige_cmip6/nasa_rsds_extra_models.py --model "${{ matrix.model }}"
      - name: Preserve each model's observed provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-nasa-rsds-${{ matrix.model }}
          path: outputs/nasa_ensemble/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 14
