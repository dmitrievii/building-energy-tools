name: Climate Analyzer temporal branch patch

on:
  push:
    branches:
      - feature/v0.6.3-temporal-filtering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.3-temporal-filtering
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic temporal patch
        run: python tools/climate_analyzer/scripts/apply_temporal_filtering_063.py
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            tools/climate_analyzer/app.py \
            tools/climate_analyzer/epw_climate_analyzer/temporal_filtering.py \
            tools/climate_analyzer/epw_climate_analyzer/aggregations.py \
            tools/climate_analyzer/epw_climate_analyzer/precipitation.py \
            tools/climate_analyzer/epw_climate_analyzer/charts.py \
            tools/climate_analyzer/epw_climate_analyzer/decisions.py \
            tools/climate_analyzer/epw_climate_analyzer/degree_metrics.py
      - name: Commit branch implementation
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/climate_analyzer/app.py \
                  tools/climate_analyzer/epw_climate_analyzer/aggregations.py \
                  tools/climate_analyzer/epw_climate_analyzer/charts.py \
                  tools/climate_analyzer/epw_climate_analyzer/decisions.py \
                  tools/climate_analyzer/epw_climate_analyzer/degree_metrics.py
          git commit -m 'CLIMATE 0.6.3: integrate global temporal filtering'
          git push origin HEAD:feature/v0.6.3-temporal-filtering
      - name: Install Climate Analyzer dependencies for diagnostics
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt
      - name: Capture focused and full regression diagnostics
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd tools/climate_analyzer
          {
            echo '=== FOCUSED 0.6.3 ==='
            python -m unittest tests.test_temporal_filtering_0_6_3 -v
            focused=$?
            echo
            echo '=== FULL SUITE ==='
            python -m unittest discover -s tests -p 'test_*.py' -v
            full=$?
            echo
            echo "focused_exit=$focused"
            echo "full_exit=$full"
            exit $(( focused != 0 || full != 0 ))
          } 2>&1 | tee ../../temporal-test-diagnostics.log
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-test-diagnostics
          path: temporal-test-diagnostics.log
          if-no-files-found: error
