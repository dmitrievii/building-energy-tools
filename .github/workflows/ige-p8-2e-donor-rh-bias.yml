name: IGE P8.2E donor humidity versus frozen temperature bias
on:
  push:
    branches:
      - research/ige-p8-meteonorm8-batch-automation-20261012
    paths:
      - research/ige_cmip6/p8_2e_donor_rh_bias_audit.py
      - research/ige_cmip6/test_p8_2e_donor_rh_bias_audit.py
      - .github/workflows/ige-p8-2e-donor-rh-bias.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-leakage-scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Confirm donor-hour identity, IDW weighting, time, bin and no-target contracts
        run: python -m unittest discover -s research/ige_cmip6 -p 'test_p8_2e_donor_rh_bias_audit.py' -v
  swiss-donor-rh-conditional-bias:
    needs: no-leakage-scientific-contracts
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify frozen Austrian training-station index
        run: |
          mkdir -p "$RUNNER_TEMP/ige_donor_rh/source" "$RUNNER_TEMP/ige_donor_rh/aggregate"
          curl --fail --location --retry 3 --retry-all-errors --max-time 150 \
            'https://tauernwetter.at/klimamittel/klimamittel_oesterreich.json' \
            --output "$RUNNER_TEMP/ige_donor_rh/source/stations.json"
          python - "$RUNNER_TEMP/ige_donor_rh/source/stations.json" <<'PY'
          import json,sys
          stations=json.load(open(sys.argv[1],encoding='utf8'))['stationen']
          assert len(stations)==258 and sum(s.get('periode')=='1991–2020' for s in stations)==189
          print('Austrian 1991–2020 station index PASS')
          PY
      - name: Test donor-RH dependence without modification of predictor
        run: |
          python research/ige_cmip6/p8_2e_donor_rh_bias_audit.py \
            --year ${{ matrix.year }} \
            --austria-station-normals "$RUNNER_TEMP/ige_donor_rh/source/stations.json" \
            --out "$RUNNER_TEMP/ige_donor_rh/aggregate"
      - name: Upload AGGREGATE grouped research tables ONLY, no raw hourly station records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ige-p8-2e-donor-rh-bias-${{ matrix.year }}
          path: |
            ${{ runner.temp }}/ige_donor_rh/aggregate/rh_bin_*.csv
            ${{ runner.temp }}/ige_donor_rh/aggregate/site_*.csv
            ${{ runner.temp }}/ige_donor_rh/aggregate/donor_rh_audit_provenance.json
          if-no-files-found: warn
          retention-days: 30