name: TEMP Climate 0.7.3 Science Hardening

on:
  push:
    branches:
      - feature/v0.7.3-geosphere-parity-closure
    paths:
      - '.github/workflows/temp-climate-073-science-hardening.yml'
      - 'deployment/.temp_science_hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.3-geosphere-parity-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        run: |
          python deployment/.temp_science_hardening.py
          python -m py_compile tools/climate_analyzer/app.py tools/climate_analyzer/epw_climate_analyzer/ground_temperature.py
      - name: Commit and self-clean
        run: |
          rm -f deployment/.temp_science_hardening.py
          rm -f .github/workflows/temp-climate-073-science-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden daylight coverage and ground source semantics"
          git push origin HEAD:feature/v0.7.3-geosphere-parity-closure
