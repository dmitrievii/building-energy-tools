name: VIS-0.1.1 Live Runtime Verification Runner

on:
  push:
    branches:
      - climate-vis-0.1.1-live-runtime-verification

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/climate_analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/climate_analyzer/requirements.txt

      - name: Patch runtime identity and live audit
        run: python tools/climate_analyzer/scripts/apply_live_runtime_verification.py

      - name: Compile Python
        working-directory: tools/climate_analyzer
        run: python -m compileall -q app.py epw_climate_analyzer tests scripts

      - name: Validate browser audit JavaScript
        run: node --check deployment/live_browser_audit.mjs

      - name: Focused runtime and semantic regressions
        working-directory: tools/climate_analyzer
        run: |
          python -m unittest discover -s tests -p 'test_live_runtime_identity_contract.py' -v
          python -m unittest discover -s tests -p 'test_semantic*.py' -v

      - name: Full Climate Analyzer regressions
        working-directory: tools/climate_analyzer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Runtime identity parity smoke
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          from epw_climate_analyzer.chart_theme import metric_color
          from epw_climate_analyzer.runtime_identity import RUNTIME_BUILD_ID
          assert len(RUNTIME_BUILD_ID) == 64
          assert metric_color('global_horizontal_radiation_wh_m2') == '#F59E0B'
          print('VIS-0.1.1 runtime identity:', RUNTIME_BUILD_ID)
          print('VIS-0.1.1 GHI semantic colour: #F59E0B')
          PY

      - name: Commit validated remediation
        run: |
          rm tools/climate_analyzer/scripts/apply_live_runtime_verification.py
          rm .github/workflows/vis-0.1.1-live-runtime-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VIS-0.1.1: verify live runtime build identity"
          git push origin HEAD:climate-vis-0.1.1-live-runtime-verification
