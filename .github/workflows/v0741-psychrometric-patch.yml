name: Climate 0.7.4.1 psychrometric patch transport

on:
  push:
    branches:
      - fix/v0.7.4.1-psychrometric-integration-remediation
    paths:
      - 'tools/climate_analyzer/scripts/apply_v0741_psychrometric.py'
      - '.github/workflows/v0741-psychrometric-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.7.4.1-psychrometric-integration-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Climate Analyzer dependencies
        working-directory: tools/climate_analyzer
        run: pip install -r requirements.txt
      - name: Normalize patch anchors
        working-directory: tools/climate_analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v0741_psychrometric.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"def sun_path_comparison_chart(\\n"': '"def sun_path_comparison_chart("',
              '"def render_humidity(\\n"': '"def render_humidity("',
              '"def render_solar(\\n"': '"def render_solar("',
              '"def render_compare_humidity(\\n"': '"def render_compare_humidity("',
              '"def render_compare_solar(\\n"': '"def render_compare_solar("',
              '"def psychrometric_interpretation(\\n"': '"def psychrometric_interpretation("',
              '"def hvac_interpretation(\\n"': '"def hvac_interpretation("',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply remediation patch and compile
        working-directory: tools/climate_analyzer
        run: |
          python scripts/apply_v0741_psychrometric.py
          python -m compileall -q app.py epw_climate_analyzer tests
      - name: Run focused psychrometric regression
        working-directory: tools/climate_analyzer
        run: python -m unittest tests.test_psychrometric_redesign_0_7_4 -v
      - name: Commit release source and remove transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/climate_analyzer/scripts/apply_v0741_psychrometric.py .github/workflows/v0741-psychrometric-patch.yml
          git add -A
          git commit -m 'fix: close 0.7.4.1 psychrometric integration remediation'
          git push origin HEAD:fix/v0.7.4.1-psychrometric-integration-remediation
