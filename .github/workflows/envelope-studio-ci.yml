name: Envelope Studio CI

on:
  push:
    paths:
      - 'tools/envelope_studio/**'
      - '.github/workflows/envelope-studio-ci.yml'
  pull_request:
    paths:
      - 'tools/envelope_studio/**'
      - '.github/workflows/envelope-studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Envelope Studio calculation tests
        working-directory: tools/envelope_studio
        run: npm test
