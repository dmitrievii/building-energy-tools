name: Envelope Studio CI

on:
  push:
    paths:
      - 'tools/envelope_studio/**'
      - '.github/workflows/envelope-studio-ci.yml'
  pull_request:
    paths:
      - 'tools/envelope_studio/**'
      - '.github/workflows/envelope-studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run calculation tests
        working-directory: tools/envelope_studio
        run: npm test
      - name: Check browser-module syntax
        working-directory: tools/envelope_studio
        run: npm run check
      - name: Build static distribution
        working-directory: tools/envelope_studio
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/src/main.js
