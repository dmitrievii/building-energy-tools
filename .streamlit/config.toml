[server]
headless = true
maxUploadSize = 10
maxMessageSize = 50
# R12: no reconnect retention; native close hook shuts down on disconnect.
disconnectedSessionTTL = 0

[client]
toolbarMode = "viewer"

[browser]
# Honored for local/self-hosted use. Streamlit Community Cloud currently
# overrides this setting to true; see deployment privacy documentation.
gatherUsageStats = false
