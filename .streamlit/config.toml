[server]
headless = true
maxUploadSize = 10
maxMessageSize = 50
# Keep the standard reconnection grace period; R7 reaps only after expiry.
disconnectedSessionTTL = 120

[client]
toolbarMode = "viewer"

[browser]
# Honored for local/self-hosted use. Streamlit Community Cloud currently
# overrides this setting to true; see deployment privacy documentation.
gatherUsageStats = false
